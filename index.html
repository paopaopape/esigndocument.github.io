function paginationHTML(current, total, fnName){
  if(total<=1) return '';
  const seq = [1];
  if(current>3) seq.push('...');
  for(let p=Math.max(2,current-1); p<=Math.min(total-1,current+1); p++) seq.push(p);
  if(current<total-2) seq.push('...');
  if(total>1) seq.push(total);
  const btn = (label, page, disabled, active) => `<button class="btn btn-sm ${active?'btn-action':'btn-outline'}" ${disabled?'disabled':''} onclick="${fnName}(${page})" style="min-width:32px;padding:4px 8px;">${label}</button>`;
  const items = [btn('‹', current-1, current<=1, false)];
  seq.forEach(p=>{
    if(p==='...') items.push(`<span style="padding:0 4px;color:var(--ink-soft);">…</span>`);
    else items.push(btn(p, p, false, p===current));
  });
  items.push(btn('›', current+1, current>=total, false));
  return `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;">${items.join('')}</div>`;
}

async function submitNewDoc(e){
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  if(submitBtn && submitBtn.disabled) return;
  const f = new FormData(e.target);
  const docName = f.get('docName');
  const companyCode = f.get('companyCode');
  const createdBy = fullName(state.user);

  // client-side check against the cached document list — catches near-duplicates regardless of
  // how far apart in time they're submitted (the server-side check only guards a short window)
  const dupe = state.documents.find(d=>
    String(d.docName||'').trim().toLowerCase()===String(docName||'').trim().toLowerCase() &&
    String(d.companyCode||'')===String(companyCode||'') &&
    String(d.createdBy||'')===createdBy
  );
  if(dupe){
    const proceed = confirm('พบว่ามีเอกสารชื่อเดียวกันนี้วางบิลไว้แล้ว (ID: '+displayId(dupe.id)+')\nต้องการวางบิลซ้ำอีกครั้งจริงหรือไม่?');
    if(!proceed) return;
  }

  // ประเภทที่ข้ามขั้นตอนอนุมัติ — ย้ำให้ยืนยันอีกครั้งก่อนส่งจริง เพราะเอกสารจะเป็น Complete ทันที
  // ไม่มีใครตรวจอีกแล้ว และต้องเตือนให้ส่งเอกสารต้นฉบับตัวจริงไปแผนกบัญชีควบคู่กันไปด้วย
  const selectedDocType = state.docTypes.find(t=>t.key===f.get('docType'));
  if(selectedDocType && selectedDocType.autoComplete){
    const proceedAuto = confirm('ยืนยันเลือกประเภทเอกสาร "'+selectedDocType.label+'"\n\nเอกสารนี้จะถูกบันทึกเป็นสถานะ Complete ทันที ไม่ต้องผ่านขั้นตอนอนุมัติใดๆ\n\nหากยืนยัน โปรดส่งเอกสารต้นฉบับตัวจริงไปยังแผนกบัญชีด้วย\n\nต้องการดำเนินการต่อหรือไม่?');
    if(!proceedAuto) return;
  }

  if(!confirm('ยืนยันส่งเอกสารเข้าสู่กระบวนการอนุมัติใช่หรือไม่?\n\nกรุณาตรวจสอบข้อมูลให้ครบถ้วนก่อนกด "ตกลง"')) return;
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังส่ง...'; }
  showBusyOverlay('กำลังส่งเอกสารเข้าสู่การอนุมัติ กรุณารอสักครู่...');
  const payload = {
    docType: f.get('docType'), docName, comment: f.get('comment')||'',
    dueDate: f.get('dueDate'), linkFile: f.get('linkFile'), companyCode,
    vendor: f.get('vendor')||'', vendorName: f.get('vendorName')||'',
    netAmount: f.get('netAmount')||'',
    createdBy, createdDate: new Date().toISOString().slice(0,10),
  };
  const res = await apiCall('addDocument', payload);
  hideBusyOverlay();
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'ส่งเข้าสู่กระบวนการอนุมัติ'; }
  if(!res.success){
    if(res.error === 'duplicate_submission'){
      const idText = res.duplicateId ? ' อ้างอิง ID เลขที่ '+displayId(res.duplicateId) : '';
      showToast('มีการบันทึกวางบิลเอกสารนี้ไปแล้ว'+idText+' — ระบบป้องกันไม่ให้วางบิลซ้ำ ถ้าตั้งใจส่งจริงๆ กรุณารอสักครู่แล้วลองใหม่', 5000);
      return;
    }
    showToast('วางบิลไม่สำเร็จ ลองใหม่อีกครั้ง'); return;
  }
  showToast(res.autoCompleted
    ? 'วางบิลเอกสารเรียบร้อย ID '+displayId(res.id)+' — ประเภทนี้ข้ามขั้นตอนอนุมัติ บันทึกเป็น Complete ให้ทันทีแล้ว'
    : 'วางบิลเอกสารเรียบร้อย ID '+displayId(res.id), 5000);
  e.target.reset();
  await refreshData();
  state.view = 'tracking';
  render();
}

function onSaOwnVendorInput(){
  const el = document.getElementById('saown-vendor');
  if(!el) return;
  const match = findVendorByLabel_(currentFormCompany_(), el.value);
  const bankBlock = document.getElementById('saown-bank-block');
  if(match){
    el.value = match.vendorCode;
    const nameEl = document.getElementById('saown-vendorName');
    if(nameEl) nameEl.value = match.vendorName;
  }
  if(bankBlock){
    const v = findVendor_(currentFormCompany_(), el.value);
    bankBlock.innerHTML = (v && (v.bankAccount||v.bankName))
      ? `<span style="font-size:12px;color:var(--ink-soft);">เลขที่บัญชี: ${v.bankAccount||'-'} · ธนาคาร: ${v.bankName||'-'}</span>`
      : (el.value ? `<span style="font-size:11.5px;color:var(--stamp-red);">ไม่พบใน Vendor Master — สามารถกรอกเพิ่มเองได้ทีหลังจากหน้าอนุมัติเอกสาร</span>` : '');
  }
}
function applySaOwnWhtRate(rate){
  if(!rate) return;
  const baseEl = document.getElementById('saown-baseAmount'), whtEl = document.getElementById('saown-whtAmount');
  if(!baseEl || !whtEl) return;
  const w = whtFromRate_(unformatMoney(baseEl.value), parseFloat(rate));
  whtEl.value = formatMoney(w);
  const vEl = document.getElementById('saown-vatAmount'), nEl = document.getElementById('saown-netAmount');
  if(nEl) nEl.value = formatMoney(netFrom_(baseEl.value, vEl?vEl.value:0, w));
  updateSaOwnHints();
}
function saOwnAmtBlur(el){
  const raw = unformatMoney(el.value);
  el.value = raw==='' ? '' : formatMoney(raw);
  if(el.id==='saown-baseAmount'){ // a WHT rate is selected -> keep WHT Amt = Base x rate
    const rs = document.getElementById('saown-whtRate'), whtEl = document.getElementById('saown-whtAmount');
    if(rs && rs.value && whtEl){
      const w = whtFromRate_(raw, parseFloat(rs.value));
      whtEl.value = formatMoney(w);
      const vEl = document.getElementById('saown-vatAmount'), nEl = document.getElementById('saown-netAmount');
      if(nEl) nEl.value = formatMoney(netFrom_(raw, vEl?vEl.value:0, w));
    }
  }
  updateSaOwnHints();
}
function updateSaOwnHints(){
  const get = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const base = get('saown-baseAmount'), vat = get('saown-vatAmount'), wht = get('saown-whtAmount'), net = get('saown-netAmount');
  const whtHint = document.getElementById('saown-wht-hint');
  const netHint = document.getElementById('saown-net-hint');
  if(whtHint) whtHint.innerHTML = whtPercentHTML(base, wht);
  if(netHint) netHint.innerHTML = amountMismatchHTML(base, vat, wht, net);
  const rs = document.getElementById('saown-whtRate');
  if(rs) rs.value = whtRateSelectedFor_(base, wht);
}
function applySaOwnTaxCalc(taxCode){
  if(!taxCode) return;
  const netEl = document.getElementById('saown-netAmount');
  const rs = document.getElementById('saown-whtRate'), whtEl = document.getElementById('saown-whtAmount');
  const rateOn = !!(rs && rs.value && whtEl);
  const net = (netEl ? parseFloat(unformatMoney(netEl.value))||0 : 0) + (rateOn ? (parseFloat(unformatMoney(whtEl.value))||0) : 0);
  const { base, vat } = taxSplit_(taxCode, net);
  const baseEl = document.getElementById('saown-baseAmount');
  const vatEl = document.getElementById('saown-vatAmount');
  if(baseEl) baseEl.value = formatMoney(base);
  if(vatEl) vatEl.value = formatMoney(vat);
  if(rateOn){ const w = whtFromRate_(base, parseFloat(rs.value)); whtEl.value = formatMoney(w); if(netEl) netEl.value = formatMoney(netFrom_(base, vat, w)); }
  updateSaOwnHints();
}

/* ---------- SAP sub-lines (Sub ID) for the self-approve form ----------
   The document doesn't exist yet while this form is being filled, so this mirrors the main
   dashboard's SAP-line splitting (gatherCurrentSapLinesFromDOM / saveSapLinesToDoc) but keeps
   everything in local state.saOwnSapLines until the whole form is submitted — at which point
   submitApproveOwn() folds the lines into the newly created document in the same patch used
   for the accountant self-approval, the same way addSapLineInline()/saveSapLinesToDoc() do for

    <td><input type="text" inputmode="decimal" class="sap-input" style="width:85px;text-align:right;" id="saownsap-base-${i}" value="${money(l.base)}" placeholder="0.00" onfocus="this.value=unformatMoney(this.value)" onblur="saOwnSapLineAmtBlur(${i},'base')"></td>
    <td><input type="text" inputmode="decimal" class="sap-input" style="width:85px;text-align:right;" id="saownsap-net-${i}" value="${money(l.net)}" placeholder="0.00" onfocus="this.value=unformatMoney(this.value)" onblur="saOwnSapLineAmtBlur(${i})"></td>

        <option value="" ${!l.taxCode?'selected':''}>—</option>
        <option value="V7" ${l.taxCode==='V7'?'selected':''}>V7</option>
        <option value="D7" ${l.taxCode==='D7'?'selected':''}>D7</option>

function refreshSaOwnSapLineContainer(){

function gatherSaOwnSapLinesFromDOM(){
  return (state.saOwnSapLines||[]).map((l,i)=>{

    return {
      fiDoc: (get('fidoc')||'').trim(),
      webDocNo: (get('webdocno')||'').trim(),
      vendor: (get('vendor')||'').trim(),
      vendorName: (get('vendorname')||'').trim(),
      taxCode: get('tax')||'',
      vat: parseFloat(unformatMoney(get('vat')))||0,
      wht: parseFloat(unformatMoney(get('wht')))||0,
      base: parseFloat(unformatMoney(get('base')))||0,
      net: parseFloat(unformatMoney(get('net')))||0,
    };
  });
}
function addSaOwnSapLine(){
  let lines = gatherSaOwnSapLinesFromDOM(); // preserve any edits already made before adding
  if(lines.length === 0){
    const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
    const line1 = {
      fiDoc: (val('saown-docSAP')||'').trim(),
      webDocNo: (val('saown-webDocNo')||'').trim(),
      vendor: (val('saown-vendor')||'').trim(),
      vendorName: (val('saown-vendorName')||'').trim(),
      taxCode: val('saown-taxCode')||'',
      vat: parseFloat(unformatMoney(val('saown-vatAmount')))||0,
      wht: parseFloat(unformatMoney(val('saown-whtAmount')))||0,
      base: parseFloat(unformatMoney(val('saown-baseAmount')))||0,
      net: parseFloat(unformatMoney(val('saown-netAmount')))||0,
    };
    const line2 = { fiDoc:'', webDocNo:'', vendor:'', vendorName:'', taxCode:'', vat:0, wht:0, base:0, net:0 };
    lines = [line1, line2];
  } else {
    lines.push({ fiDoc:'', webDocNo:'', vendor:'', vendorName:'', taxCode:'', vat:0, wht:0, base:0, net:0 });
  }
  state.saOwnSapLines = lines;
  refreshSaOwnSapLineContainer();

}
function removeSaOwnSapLine(idx){
  const lines = gatherSaOwnSapLinesFromDOM();
  lines.splice(idx,1);
  state.saOwnSapLines = lines;
  refreshSaOwnSapLineContainer();
  recomputeSaOwnSapTotalsLive();

function applySaOwnSapLineWhtRate(idx, rate){
  if(!rate) return;
  const baseEl = document.getElementById('saownsap-base-'+idx), whtEl = document.getElementById('saownsap-wht-'+idx);
  if(!baseEl || !whtEl) return;
  const w = whtFromRate_(unformatMoney(baseEl.value), parseFloat(rate));
  whtEl.value = formatMoney(w);
  const vEl = document.getElementById('saownsap-vat-'+idx), nEl = document.getElementById('saownsap-net-'+idx);
  if(nEl) nEl.value = formatMoney(netFrom_(baseEl.value, vEl?vEl.value:0, w));
  recomputeSaOwnSapTotalsLive();
}
function saOwnSapLineAmtBlur(idx, field){
  const rs = document.getElementById('saownsap-whtrate-'+idx);
  if(field==='base' && rs && rs.value){ // a WHT rate is selected -> keep WHT = Base x rate
    const bEl = document.getElementById('saownsap-base-'+idx), wEl = document.getElementById('saownsap-wht-'+idx);
    if(bEl && wEl){
      const w = whtFromRate_(unformatMoney(bEl.value), parseFloat(rs.value));
      wEl.value = formatMoney(w);
      const vEl = document.getElementById('saownsap-vat-'+idx), nEl = document.getElementById('saownsap-net-'+idx);
      if(nEl) nEl.value = formatMoney(netFrom_(bEl.value, vEl?vEl.value:0, w));
    }
  }
  ['vat','wht','base','net'].forEach(f=>{
    const e = document.getElementById('saownsap-'+f+'-'+idx);
    if(e){ const raw = unformatMoney(e.value); e.value = raw==='' ? '' : formatMoney(raw); }
  });
  if(rs){ const bE = document.getElementById('saownsap-base-'+idx), wE = document.getElementById('saownsap-wht-'+idx); rs.value = whtRateSelectedFor_(bE?bE.value:'', wE?wE.value:''); }
  recomputeSaOwnSapTotalsLive();
}
function applySaOwnSapLineTaxCalc(idx, taxCode){
  if(!taxCode) return;
  const netEl = document.getElementById('saownsap-net-'+idx);
  const rs = document.getElementById('saownsap-whtrate-'+idx), wEl = document.getElementById('saownsap-wht-'+idx);
  const rateOn = !!(rs && rs.value && wEl);
  const net = (netEl ? parseFloat(unformatMoney(netEl.value))||0 : 0) + (rateOn ? (parseFloat(unformatMoney(wEl.value))||0) : 0);
  const { base, vat } = taxSplit_(taxCode, net);
  const baseEl = document.getElementById('saownsap-base-'+idx);
  const vatEl = document.getElementById('saownsap-vat-'+idx);
  if(baseEl) baseEl.value = formatMoney(base);
  if(vatEl) vatEl.value = formatMoney(vat);
  if(rateOn){ const w = whtFromRate_(base, parseFloat(rs.value)); wEl.value = formatMoney(w); if(netEl) netEl.value = formatMoney(netFrom_(base, vat, w)); }
  recomputeSaOwnSapTotalsLive();
}
function onSaOwnSapLineVendorInput(idx){
  const el = document.getElementById('saownsap-vendor-'+idx);
  if(!el) return;
  const match = findVendorByLabel_(currentFormCompany_(), el.value);
  if(match){
    el.value = match.vendorCode;
    const nameEl = document.getElementById('saownsap-vendorname-'+idx);
    if(nameEl) nameEl.value = match.vendorName;
  }
}
function recomputeSaOwnSapTotalsLive(){
  const lines = gatherSaOwnSapLinesFromDOM();
  if(!lines.length) return;
  const sums = lines.reduce((t,l)=>({vat:t.vat+(parseFloat(l.vat)||0), wht:t.wht+(parseFloat(l.wht)||0), base:t.base+(parseFloat(l.base)||0), net:t.net+(parseFloat(l.net)||0)}), {vat:0,wht:0,base:0,net:0});
  const vatEl = document.getElementById('saown-vatAmount');
  const whtEl = document.getElementById('saown-whtAmount');
  const baseEl = document.getElementById('saown-baseAmount');
  const netEl = document.getElementById('saown-netAmount');
  if(vatEl) vatEl.value = formatMoney(sums.vat);
  if(whtEl) whtEl.value = formatMoney(sums.wht);
  if(baseEl) baseEl.value = formatMoney(sums.base);
  if(netEl) netEl.value = formatMoney(sums.net);
  updateSaOwnHints();
}
function toggleSaOwnSkipReasonOther(){
  const sel = document.getElementById('saown-skip-reason');
  const other = document.getElementById('saown-skip-reason-other');
  if(!sel || !other) return;
  other.style.display = sel.value === 'อื่นๆ' ? 'block' : 'none';
}

/* ============ Excel upload (สรุปรายเจ้าหนี้) for the self-approve form ============
   The file is the SAP payment-run workbook: one sheet per payment type (direct / Media / ...),
   header row "Doc. Number | Account | Account Name | ... | Tax Base Amt. | Amount in Doc. | ...",
   detail rows (one per FI Doc) grouped by vendor, a yellow subtotal row after each vendor, and a
   final "Total" row. We collapse each vendor's detail rows into ONE sub-line (FI Doc range,
   Base, VAT = Amount in Doc - Tax Base, WHT, Net = Amount in Local Curr.), cross-check it
   against the sheet's own subtotal/Total rows, and show a review screen before filling the form. */
function xlsNorm_(v){ return String(v==null?'':v).replace(/\s+/g,'').toLowerCase(); }
function xlsNum_(v){
  if(typeof v==='number') return v;
  const n = parseFloat(String(v==null?'':v).replace(/,/g,''));
  return isNaN(n) ? null : n;
}
function xlsR2_(x){ return Math.round((x + Number.EPSILON)*100)/100; }
function xlsFiDocLabel_(docs){
  const list = docs.slice();
  if(list.length===1) return list[0];
  const nums = list.map(d=>/^\d+$/.test(d) ? BigInt(d) : null);
  const allNum = nums.every(n=>n!==null) && list.every(d=>d.length===list[0].length);
  if(allNum){
    let consecutive = true;
    for(let i=1;i<nums.length;i++){ if(nums[i] !== nums[i-1]+1n){ consecutive = false; break; } }
    if(consecutive) return list[0] + '-' + list[list.length-1].slice(-2);
  }
  return list.join(', ');
}
const SAP_SUMMARY_COLS_ = {
  doc:     { label:'Doc. Number',          alias:['doc.number','docnumber','docno','docno.','documentnumber','documentno','เลขที่เอกสาร','เลขเอกสาร'] },
  account: { label:'Account',              alias:['account','vendor','vendorcode','vendornumber','vendorno','รหัสเจ้าหนี้','รหัสvendor'] },
  name:    { label:'Account Name',         alias:['accountname','vendorname','ชื่อเจ้าหนี้','ชื่อvendor'], optional:true },
  base:    { label:'Tax Base Amt.',        alias:['taxbaseamt.','taxbaseamt','taxbase','baseamount','baseamt','ฐานภาษี'] },
  amt:     { label:'Amount in Doc.',       alias:['amountindoc.','amountindoc','amountindocument','grossamount','จำนวนเงินในเอกสาร'] },
  tax:     { label:'Tax Code',             alias:['taxcode','รหัสภาษี'], optional:true },
  wht:     { label:'Amt WHT.',             alias:['amtwht.','amtwht','whtamount','whtamt','wht','ภาษีหักณที่จ่าย'] },
  net:     { label:'Amount in Local Curr.',alias:['amountinlocalcurr.','amountinlocalcurr','amountinlocalcurrency','netamount','paymentamount','ยอดจ่ายสุทธิ'] },
  pm:      { label:'Payment Method',       alias:['paymentmethod','paymethod','ประเภทการจ่าย'], optional:true },
};
const SAP_SUMMARY_TOTAL_WORDS_ = ['total','grandtotal','รวม','รวมทั้งสิ้น','รวมทั้งหมด','ยอดรวม'];
function parseSapSummarySheet_(aoa){
  const docAliases = SAP_SUMMARY_COLS_.doc.alias;
  const hIdx = aoa.findIndex(r=>r.some(c=>docAliases.indexOf(xlsNorm_(c))!==-1));
  if(hIdx===-1) return null;
  const head = aoa[hIdx].map(xlsNorm_);
  const colOf = key => head.findIndex(h=>SAP_SUMMARY_COLS_[key].alias.indexOf(h)!==-1);
  const iDoc=colOf('doc'), iAcc=colOf('account'), iName=colOf('name'), iBase=colOf('base'),
        iAmt=colOf('amt'), iTax=colOf('tax'), iWht=colOf('wht'), iNet=colOf('net'), iPm=colOf('pm');
  const missing = Object.keys(SAP_SUMMARY_COLS_).filter(k=>!SAP_SUMMARY_COLS_[k].optional && colOf(k)===-1).map(k=>SAP_SUMMARY_COLS_[k].label);
  if(missing.length) return { missing };
  let comcode = '';
  for(let r=0;r<hIdx;r++){
    const ci = aoa[r].findIndex(c=>xlsNorm_(c)==='comcode');
    if(ci!==-1) comcode = String(aoa[r][ci+1]||'').trim();
  }
  const vendors = []; const byCode = {};
  let last = null, sheetTotal = null, totalRowIdx = -1;
  for(let r=hIdx+1; r<aoa.length; r++){
    const row = aoa[r];
    if(row.some(c=>SAP_SUMMARY_TOTAL_WORDS_.indexOf(xlsNorm_(c))!==-1)){
      totalRowIdx = r;
      sheetTotal = { base:xlsNum_(row[iBase]), amt:xlsNum_(row[iAmt]), wht:xlsNum_(row[iWht]), net:xlsNum_(row[iNet]) };
      break;
    }
    const doc = String(row[iDoc]==null?'':row[iDoc]).trim();
    const acc = String(row[iAcc]==null?'':row[iAcc]).trim();
    if(doc && acc){
      let v = byCode[acc];
      if(!v){
        v = byCode[acc] = { code:acc, name:String(row[iName]||'').trim(), docs:[], base:0, amt:0, wht:0, net:0, sub:null, pm:new Set(), vats:0 };
        vendors.push(v);
      }
      v.docs.push(doc);
      v.base += xlsNum_(row[iBase])||0; v.amt += xlsNum_(row[iAmt])||0;
      v.wht += xlsNum_(row[iWht])||0;   v.net += xlsNum_(row[iNet])||0;
      if(iPm!==-1 && row[iPm]!=='' && row[iPm]!=null) v.pm.add(String(row[iPm]).trim().toUpperCase());
      last = v;
    } else if(last){
      const b=xlsNum_(row[iBase]), a=xlsNum_(row[iAmt]), w=xlsNum_(row[iWht]), n=xlsNum_(row[iNet]);
      if(b!==null || a!==null || n!==null){
        last.sub = { base:b, amt:a, wht:w, net:n };
      }
    }
  }
  // anything that still looks like a data row below the Total row (footers/notes are ignored)
  const trailing = [];
  if(totalRowIdx!==-1){
    for(let r=totalRowIdx+1; r<aoa.length; r++){
      const doc = String(aoa[r][iDoc]==null?'':aoa[r][iDoc]).trim();
      const acc = String(aoa[r][iAcc]==null?'':aoa[r][iAcc]).trim();
      if(doc && acc) trailing.push({ doc, acc, amt: xlsNum_(aoa[r][iAmt]) });
    }
  }
  const lines = vendors.map(v=>{
    const base = xlsR2_(v.base), amt = xlsR2_(v.amt), wht = xlsR2_(v.wht), net = xlsR2_(v.net);
    const vat = xlsR2_(amt - base);
    return { code:v.code, name:v.name, docs:v.docs, fiDoc:xlsFiDocLabel_(v.docs), base, vat, wht, net,
      taxCode: vat>0 ? 'V7' : 'VX', pm:[...v.pm], sub:v.sub, checked:true };
  });
  return { comcode, lines, sheetTotal, trailing, hasTotalRow: totalRowIdx!==-1 };
}
function saOwnExcelValidate_(parsed, formCompany){
  const issues = [];   // {level:'error'|'warn', text}
  const lines = parsed.lines.filter(l=>l.checked);
  const money = n => (parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const tol = 0.011;
  const existing = state.documents.map(d=>String(d.docSAP||'')+' '+String(d.sapLines||'')).join(' ');
  parsed.lines.forEach(l=>{
    l.issues = [];
    const calc = xlsR2_(l.base + l.vat - l.wht);
    if(Math.abs(calc - l.net) > tol) l.issues.push({level:'error', text:'Base + VAT − WHT = '+money(calc)+' ไม่เท่ากับยอดสุทธิ '+money(l.net)});
    if(l.sub){
      const sb = l.sub;
      const diffs = [];
      if(sb.base!==null && Math.abs(xlsR2_(sb.base) - l.base) > tol) diffs.push('Base ในไฟล์ '+money(sb.base));
      if(sb.amt!==null && Math.abs(xlsR2_(sb.amt) - xlsR2_(l.base+l.vat)) > tol) diffs.push('Amount in Doc ในไฟล์ '+money(sb.amt));
      if(sb.wht!==null && Math.abs(xlsR2_(sb.wht) - l.wht) > tol) diffs.push('WHT ในไฟล์ '+money(sb.wht));
      if(sb.net!==null && Math.abs(xlsR2_(sb.net) - l.net) > tol) diffs.push('Net ในไฟล์ '+money(sb.net));
      if(diffs.length) l.issues.push({level:'error', text:'ไม่ตรงกับแถวสรุป (สีเหลือง) ของ Vendor นี้: '+diffs.join(', ')});
    } else {
      l.issues.push({level:'warn', text:'ไม่พบแถวสรุปของ Vendor นี้ในไฟล์ — ใช้ผลรวมที่คำนวณจากรายการ'});
    }
    if(!findVendor_(currentFormCompany_(), l.code)) l.issues.push({level:'warn', text:'ไม่พบรหัส Vendor นี้ใน Vendor Master'});
    const dupDocs = l.docs.filter(d=>existing.indexOf(d)!==-1);
    if(dupDocs.length) l.issues.push({level:'warn', text:'FI Doc '+dupDocs.join(', ')+' มีอยู่ในเอกสารอื่นในระบบแล้ว อาจซ้ำ'});
    if(l.net < 0) l.issues.push({level:'warn', text:'ยอดสุทธิติดลบ (ใบลดหนี้/รายการกลับ)'});
    if(l.pm.length > 1) l.issues.push({level:'warn', text:'Payment Method ปะปนกัน: '+l.pm.join(', ')});
  });
  if(parsed.hasTotalRow && parsed.sheetTotal){
    const t = parsed.sheetTotal;
    const all = parsed.lines;
    const sum = f => xlsR2_(all.reduce((a,l)=>a+f(l),0));
    const comps = [
      ['Base', t.base, sum(l=>l.base)], ['Amount in Doc', t.amt, sum(l=>l.base+l.vat)],
      ['WHT', t.wht, sum(l=>l.wht)], ['Net', t.net, sum(l=>l.net)],
    ];
    comps.forEach(([label, fileVal, calcVal])=>{
      if(fileVal!==null && Math.abs(xlsR2_(fileVal) - calcVal) > tol){
        issues.push({level:'error', text:'แถว Total ของไฟล์ ('+label+' '+money(fileVal)+') ไม่เท่ากับผลรวมรายการที่อ่านได้ ('+money(calcVal)+') ผลต่าง '+money(calcVal - fileVal)});
      }
    });
  } else if(!parsed.hasTotalRow){
    issues.push({level:'warn', text:'ไม่พบแถว "Total" ในชีทนี้ — ไม่สามารถเทียบยอดรวมได้'});
  }
  const pmAll = new Set(); lines.forEach(l=>l.pm.forEach(x=>pmAll.add(x)));
  if(pmAll.size > 1) issues.push({level:'warn', text:'Payment Method ในไฟล์ปะปนกัน ('+[...pmAll].join(', ')+') แต่เอกสารหนึ่งใบมีประเภทการจ่ายได้ 1 แบบ — ระบบจะไม่เลือกประเภทการจ่ายให้ กรุณาเลือกเอง หรือติ๊กเฉพาะ Vendor ที่จ่ายแบบเดียวกัน'});
  if(parsed.trailing.length){
    issues.push({level:'warn', text:'พบรายการข้อมูลอยู่ใต้แถว Total '+parsed.trailing.length+' แถว (FI Doc '+parsed.trailing.map(t=>t.doc).join(', ')+') — ระบบข้ามไปไม่นำเข้า กรุณาตรวจสอบไฟล์'});
  }
  if(parsed.comcode && formCompany && String(parsed.comcode)!==String(formCompany)){
    issues.push({level:'warn', text:'รหัสบริษัทในไฟล์ ('+parsed.comcode+') ไม่ตรงกับบริษัทที่เลือกในฟอร์ม ('+formCompany+')'});
  }
  parsed.lines.forEach(l=>l.issues.forEach(i=>{ if(i.level==='error' && l.checked) issues.push({level:'error', text:'Vendor '+l.code+': '+i.text}); }));
  return issues;
}

function uploadSaOwnExcel(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const st = document.getElementById('saown-excel-status');
  if(st) st.textContent = 'กำลังอ่านไฟล์...';
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      if(typeof XLSX === 'undefined'){ if(st) st.textContent = 'โหลดไลบรารีอ่านไฟล์ไม่สำเร็จ ลองรีเฟรชหน้าเว็บ'; return; }
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
      const sheets = {}; const problems = [];
      wb.SheetNames.forEach(name=>{
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:true});
        const parsed = parseSapSummarySheet_(aoa);
        if(!parsed) return;
        if(parsed.missing){ problems.push('ชีท "'+name+'" พบหัวตารางแต่ขาดคอลัมน์: '+parsed.missing.join(', ')); return; }
        if(parsed.lines.length) sheets[name] = parsed;
        else problems.push('ชีท "'+name+'" ไม่พบแถวรายการที่มี Doc. Number และ Account');
      });
      e.target.value = '';
      const names = Object.keys(sheets);
      if(!names.length){
        if(st) st.textContent = 'อ่านไฟล์ไม่ได้ตามรูปแบบที่ระบบกำหนด';
        showSapTemplateHelp_(file.name, problems);
        return;
      }
      if(st) st.textContent = 'อ่านไฟล์แล้ว: '+file.name+' ('+names.length+' ชีท)';
      state.pendingSaOwnExcel = { fileName:file.name, sheets, selected:names[0] };
      renderSaOwnExcelModal();
    }catch(err){
      if(st) st.textContent = 'อ่านไฟล์ไม่สำเร็จ: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

function setSaOwnExcelChecked(i, v){
  const pend = state.pendingSaOwnExcel; if(!pend) return;
  pend.sheets[pend.selected].lines[i].checked = v;
  renderSaOwnExcelModal();
}
function toggleAllSaOwnExcel(v){
  const pend = state.pendingSaOwnExcel; if(!pend) return;
  pend.sheets[pend.selected].lines.forEach(l=>{ l.checked = v; });
  renderSaOwnExcelModal();
}
function setSaOwnExcelSheet(name){
  const pend = state.pendingSaOwnExcel; if(!pend) return;
  pend.selected = name;
  renderSaOwnExcelModal();
}
function cancelSaOwnExcel(){ state.pendingSaOwnExcel = null; hideBusyOverlay(); }
function confirmSaOwnExcel(){
  const pend = state.pendingSaOwnExcel; if(!pend) return;
  const parsed = pend.sheets[pend.selected];
  const sel = parsed.lines.filter(l=>l.checked);
  if(!sel.length){ showToast('กรุณาติ๊กเลือกอย่างน้อย 1 รายการ'); return; }
  const companyEl = document.querySelector('form select[name="companyCode"]');
  const issues = saOwnExcelValidate_(parsed, companyEl ? companyEl.value : '');
  const errCount = issues.filter(i=>i.level==='error').length;
  if(errCount && !confirm('ยังมีรายการที่ตรวจสอบไม่ผ่าน '+errCount+' จุด (แสดงเป็นสีแดง)\n\nต้องการนำเข้าต่อหรือไม่?')) return;
  const lines = sel.map(l=>({
    fiDoc:l.fiDoc, webDocNo:'', vendor:l.code, vendorName:l.name, taxCode:l.taxCode,
    vat:l.vat, wht:l.wht, base:l.base, net:l.net,
  }));
  const setVal = (id, v) => { const el = document.getElementById(id); if(el){ el.value = v; el.dispatchEvent(new Event('input')); } };
  if(lines.length === 1){
    const l = lines[0];
    state.saOwnSapLines = [];
    refreshSaOwnSapLineContainer();
    setVal('saown-docSAP', l.fiDoc); setVal('saown-vendor', l.vendor); setVal('saown-vendorName', l.vendorName);
    setVal('saown-vatAmount', formatMoney(l.vat)); setVal('saown-whtAmount', formatMoney(l.wht));
    setVal('saown-baseAmount', formatMoney(l.base)); setVal('saown-netAmount', formatMoney(l.net));
    const tx = document.getElementById('saown-taxCode'); if(tx) tx.value = l.taxCode;
    updateSaOwnHints();
  } else {
    state.saOwnSapLines = lines;
    refreshSaOwnSapLineContainer();
    recomputeSaOwnSapTotalsLive();
    // the single-line "main" fields are required by the form — seed them from the first line
    const first = lines[0];
    setVal('saown-docSAP', first.fiDoc); setVal('saown-vendor', first.vendor); setVal('saown-vendorName', first.vendorName);
  }
  // payment type from the sheet's Payment Method column, when every selected vendor agrees
  const pms = new Set(); sel.forEach(l=>l.pm.forEach(x=>pms.add(x)));
  if(pms.size===1){
    const v = [...pms][0];
    const radio = document.querySelector('input[name="payType"][value="'+v+'"]');
    if(radio) radio.checked = true;
  }
  state.pendingSaOwnExcel = null;
  hideBusyOverlay();
  showToast('นำเข้าจาก Excel '+lines.length+' รายการเรียบร้อย — ตรวจสอบในฟอร์มอีกครั้งก่อนกดส่ง');
}

async function submitApproveOwn(e){
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  if(submitBtn && submitBtn.disabled) return;
  const f = new FormData(e.target);
  const docName = f.get('docName');
  const companyCode = f.get('companyCode');
  const createdBy = fullName(state.user);
  const sapVal = (f.get('docSAP')||'').trim();
  const vendorVal = (f.get('vendor')||'').trim();
  const vendorNameVal = (f.get('vendorName')||'').trim();
  const payTypeVal = f.get('payType');
  const missing = [];
  if(!sapVal) missing.push('Document SAP');
  if(!vendorVal) missing.push('Vendor');
  if(!vendorNameVal) missing.push('Vendor Name');
  if(!payTypeVal) missing.push('ประเภทการจ่าย');
  if(missing.length){ showToast('กรุณากรอกให้ครบก่อนส่ง: '+missing.join(', ')); return; }

  // ข้ามผู้ตรวจสอบเป็นเรื่องผิดปกติของ Flow ปกติ — ต้องมีเหตุผลกำกับไว้เสมอเพื่อการตรวจสอบย้อนหลัง,
  // same rule as the normal accountant-stage skipReviewerStage()
  const skipReasonSel = document.getElementById('saown-skip-reason');
  const skipReasonOtherEl = document.getElementById('saown-skip-reason-other');
  const skipReasonSelected = skipReasonSel ? skipReasonSel.value : '';
  const skipReviewerReason = skipReasonSelected==='อื่นๆ' ? (skipReasonOtherEl ? skipReasonOtherEl.value.trim() : '') : skipReasonSelected;
  if(skipReasonSelected && !skipReviewerReason){ showToast('กรุณาระบุเหตุผลที่ข้ามผู้ตรวจสอบในช่อง "อื่นๆ"'); return; }

  const dupe = state.documents.find(d=>
    String(d.docName||'').trim().toLowerCase()===String(docName||'').trim().toLowerCase() &&
    String(d.companyCode||'')===String(companyCode||'') &&
    String(d.createdBy||'')===createdBy
  );
  if(dupe){
    const proceed = confirm('พบว่ามีเอกสารชื่อเดียวกันนี้วางบิลไว้แล้ว (ID: '+displayId(dupe.id)+')\nต้องการวางบิลซ้ำอีกครั้งจริงหรือไม่?');
    if(!proceed) return;
  }
  if(skipReviewerReason){
    if(!confirm('ยืนยันข้ามขั้นตอนผู้ตรวจสอบ และส่งเอกสารนี้ตรงไปที่ผู้อนุมัติเลยใช่หรือไม่?\n\nเหตุผล: '+skipReviewerReason)) return;
  }

  if(!confirm('ยืนยันส่งเอกสารเข้าสู่กระบวนการอนุมัติใช่หรือไม่?\n\nกรุณาตรวจสอบข้อมูลให้ครบถ้วนก่อนกด "ตกลง"')) return;
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังส่ง...'; }
  showBusyOverlay('กำลังส่งเอกสารเข้าสู่การอนุมัติ กรุณารอสักครู่...');

  const netAmount = unformatMoney(f.get('netAmount')||'');
  const basicPayload = {
    docType: f.get('docType'), docName, comment: '',
    dueDate: f.get('dueDate'), linkFile: f.get('linkFile'), companyCode,
    vendor: vendorVal, vendorName: vendorNameVal, netAmount,
    createdBy, createdDate: new Date().toISOString().slice(0,10),
  };
  const res1 = await apiCall('addDocument', basicPayload);
  if(!res1.success){
    hideBusyOverlay();
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '✓ ส่งเข้าสู่กระบวนการอนุมัติ'; }
    if(res1.error === 'duplicate_submission'){
      const idText = res1.duplicateId ? ' อ้างอิง ID เลขที่ '+displayId(res1.duplicateId) : '';
      showToast('มีการบันทึกวางบิลเอกสารนี้ไปแล้ว'+idText+' — ระบบป้องกันไม่ให้วางบิลซ้ำ ถ้าตั้งใจส่งจริงๆ กรุณารอสักครู่แล้วลองใหม่', 5000);
      return;
    }
    showToast('วางบิลไม่สำเร็จ ลองใหม่อีกครั้ง'); return;
  }

  const newId = res1.id;
  const note = (f.get('note')||'').trim();
  const skipApprover = !!document.getElementById('saown-skipApprover').checked;
  const skipFinance = !!e.target.querySelector('input[name="skipFinance"]').checked || isViaPaymentType_(f.get('docType'));
  let accountantNoteVal = note ? appendNoteText('', note) : '';
  const historyEntries = [{ stage:'นักบัญชี', actor: createdBy, date: nowStr(), note: note||'', action:'approve' }];
  if(skipReviewerReason){
    accountantNoteVal = appendNoteText(accountantNoteVal, 'ข้ามผู้ตรวจสอบ: '+skipReviewerReason);
    historyEntries.push({ stage:'ผู้ตรวจสอบ', actor: createdBy, date: nowStr(), note: 'ข้ามโดยนักบัญชี เหตุผล: '+skipReviewerReason, action:'skip_reviewer' });
  }
  const patch = {
    id: newId,
    docSAP: sapVal, webDocNo: (f.get('webDocNo')||'').trim(),
    vendor: vendorVal, vendorName: vendorNameVal,
    vatAmount: unformatMoney(f.get('vatAmount')||''), whtAmount: unformatMoney(f.get('whtAmount')||''),
    baseAmount: unformatMoney(f.get('baseAmount')||''), netAmount,
    taxCode: f.get('taxCode')||'',
    payType: payTypeVal,
    skipApprover: skipApprover ? 'TRUE' : '', skipFinance: skipFinance ? 'TRUE' : '',
    accountantBy: createdBy, accountantDate: nowStr(),
    accountantNote: accountantNoteVal,
    // this form only self-approves the นักบัญชี stage — it must always forward to "รอผู้ตรวจสอบ"
    // next (unless skipReviewerReason sends it straight to "รอผู้อนุมัติ" instead, same as the
    // normal flow's skipReviewerStage()). The skipApprover/skipFinance flags are just saved on
    // the doc here; they only take effect later, exactly like the normal flow, when the
    // ผู้ตรวจสอบ (reviewer) — or, if skipped, the ผู้อนุมัติ directly — approves it next
    // (see processStage(): doc.status==='รอผู้ตรวจสอบ' && skipApprover decides the jump then).
    status: skipReviewerReason ? 'รอผู้อนุมัติ' : 'รอผู้ตรวจสอบ',
    modifiedBy: createdBy, modifiedDate: nowStr(),
    historyLog: JSON.stringify(historyEntries),
    // เมนูนี้คือนักบัญชีคีย์เอกสารเข้าระบบเอง แปลว่าบิลต้นฉบับอยู่ที่แผนกบัญชีอยู่แล้วตั้งแต่แรก —
    // ไม่ต้องรอ flow รับเอกสารจริงทีละขั้น (ธุรการ → นักบัญชี #1 → นักบัญชี #2) เหมือนเอกสารที่คนอื่น
    // วางบิลแล้วต้องส่งตัวจริงตามมาทีหลัง จึงติ๊ก Tracking Invoice ให้ครบ "รับแล้ว" ทันทีทั้ง 3 จุด
    trackClerkBy: createdBy, trackClerkDate: nowStr(),
    trackClerkNote: 'นักบัญชีวางบิลเองในระบบ — เอกสารต้นฉบับอยู่ที่แผนกบัญชีแล้ว',
    trackAcct1By: createdBy, trackAcct1Date: nowStr(),
    trackAcct1Note: 'นักบัญชีวางบิลเองในระบบ — เอกสารต้นฉบับอยู่ที่แผนกบัญชีแล้ว',
    trackAcct2By: createdBy, trackAcct2Date: nowStr(),
    trackAcct2Note: 'นักบัญชีวางบิลเองในระบบ — เอกสารต้นฉบับอยู่ที่แผนกบัญชีแล้ว',
  };
  // if the accountant split this into multiple SAP sub-lines, fold the split + its aggregate
  // totals into the same patch — mirrors saveSapLinesToDoc()'s >=2-lines branch, just done in
  // one go alongside the self-approval instead of as a separate save afterwards.
  const saOwnLines = gatherSaOwnSapLinesFromDOM();
  if(saOwnLines.length >= 2){
    saOwnLines.forEach((l,i)=>{ l.subId = newId+'-'+(i+1); });
    const sums = saOwnLines.reduce((t,l)=>({vat:t.vat+(parseFloat(l.vat)||0), wht:t.wht+(parseFloat(l.wht)||0), base:t.base+(parseFloat(l.base)||0), net:t.net+(parseFloat(l.net)||0)}), {vat:0,wht:0,base:0,net:0});
    patch.sapLines = JSON.stringify(saOwnLines);
    patch.vatAmount = sums.vat.toFixed(2);
    patch.whtAmount = sums.wht.toFixed(2);
    patch.baseAmount = sums.base.toFixed(2);
    patch.netAmount = sums.net.toFixed(2);
  }
  const res2 = await apiCall('updateDocument', patch);
  hideBusyOverlay();
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '✓ ส่งเข้าสู่กระบวนการอนุมัติ'; }
  if(!res2.success){ showToast('บันทึกสำเร็จบางส่วน (สร้างเอกสาร '+displayId(newId)+' แล้ว แต่บันทึกขั้นนักบัญชีไม่สำเร็จ) กรุณาเข้าไปแก้ไขที่หน้าอนุมัติเอกสารแทน'); await refreshData(); render(); return; }
  showToast('วางบิลและอนุมัติขั้นนักบัญชีเรียบร้อย ID '+displayId(newId)+' (ยืนยัน Tracking Invoice ให้อัตโนมัติ เนื่องจากเอกสารต้นฉบับอยู่ที่แผนกบัญชีแล้ว)', 5000);
  e.target.reset();
  state.saOwnSapLines = [];
  await refreshData();
  state.view = 'tracking';
  render();
}

/* ============================= TRACKING INVOICE ============================= */
/* Physical-document receipt tracking — fully independent of the digital approval flow.
   3 independent checkpoints (any order, any subset): ธุรการ, นักบัญชีคนที่1, นักบัญชีคนที่2.
   "รับครบ" = both accountant checkpoints stamped; the clerk checkpoint is optional/supplementary. */
function canEditTracking(){ return isAdmin() || state.user.canTrack===true; }
function canTrackDoc(doc, stage){
  if(isAdmin()) return true;
  if(state.user.canTrack!==true) return false;
  if(state.user.companyCodes && state.user.companyCodes.length){
    if(!state.user.companyCodes.includes(doc.companyCode)) return false;
  }
  // Per-checkpoint role restriction: ธุรการ can only tick the ธุรการ checkpoint, นักบัญชี can only
  // tick the 2 นักบัญชี checkpoints — prevents ticking across roles. Any other role granted canTrack
  // (e.g. User) keeps unrestricted access to all 3 checkpoints, same as before this change.
  if(stage){
    if(state.user.role==='ธุรการ' && stage!=='clerk') return false;
    if(state.user.role==='นักบัญชี' && stage!=='acct1' && stage!=='acct2') return false;
  }
  return true;
}
function trackingStatusOf(d){
  // นักบัญชี #2 = ปลายทางสุดท้าย — ติ๊กแค่คนเดียวก็ถือว่าเอกสารมาถึงปลายทางแล้วครบถ้วน
  // ไม่จำเป็นต้องรอให้ #1 ติ๊กด้วย (แต่ถ้า #1 ติ๊กแล้ว #2 ยังไม่ติ๊ก ยังถือว่าเป็นแค่ "รับบางส่วน")
  const complete = !!d.trackAcct2By;
  if(complete) return 'complete';
  const any = !!(d.trackClerkBy || d.trackAcct1By || d.trackAcct2By);
  return any ? 'partial' : 'none';
}
function trackingHTML(){
  const canEdit = canEditTracking();
  const companyOpts = trackingCompanyOptions_();
  const companyHeader = `
  <div class="company-header">
    <label>บริษัท</label>
    <select onchange="setTrackingCompany(this.value)">
      <option value="all" ${state.trackingCompany==='all'?'selected':''}>ทุกบริษัท</option>
      ${companyOpts.map(c=>`<option value="${c.code}" ${state.trackingCompany===c.code?'selected':''}>${c.code} — ${c.name}</option>`).join('')}
    </select>

function trackStampCell(d, byField, dateField, noteField, label, stage){

  doc[field] = value;
}

async function toggleTrackReceipt(id, stage){
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  if(!canTrackDoc(doc, stage)){ showToast('คุณไม่มีสิทธิ์ติ๊กรับเอกสารนี้'); return; }
  const fieldMap = {
    clerk: ['trackClerkBy','trackClerkDate'],
    acct1: ['trackAcct1By','trackAcct1Date'],
    acct2: ['trackAcct2By','trackAcct2Date'],
  };
  const pair = fieldMap[stage];
  if(!pair) return;
  const [byField, dateField] = pair;
  const wasReceived = !!doc[byField];
  if(wasReceived && !isAdmin() && doc[byField] !== fullName(state.user)){
    showToast('ยกเลิกได้เฉพาะรายการที่ตัวเองติ๊กรับไว้เท่านั้น');
    return;
  }
  const patch = { id };
  patch[byField] = wasReceived ? '' : fullName(state.user);
  patch[dateField] = wasReceived ? '' : nowStr();
  const res = await apiCall('updateDocument', patch);
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  Object.assign(doc, patch);
  showToast(wasReceived ? 'ยกเลิกการรับเอกสารแล้ว' : 'บันทึกรับเอกสารเรียบร้อย');
  render();
}

function setApprovalCompany(v){ state.approvalCompany = v; state.expandedRow=null; render(); }
function setApprovalSearch(field, val){ state.approvalSearch[field] = val; render(); }
function clearApprovalSearch(){ state.approvalSearch = {type:'', name:'', due:'', createdBy:''}; render(); }
function toggleRow(id){ state.expandedRow = state.expandedRow===id ? null : id; render(); }

/* ---- Approval-stage row edit: docType / docName / linkFile only (accountant / reviewer) ---- */
function openApprovalDocEdit(id){
  if(!canEditDocuments()) return;
  state.expandedRow = null;
  state.approvalDocEditId = id;
  render();
}
function closeApprovalDocEdit(){ state.approvalDocEditId = null; render(); }
async function saveApprovalDocEdit(e, id){
  e.preventDefault();
  if(!canEditDocuments()) return;
  const f = new FormData(e.target);
  const patch = {
    id,
    docType: f.get('docType'),
    companyCode: f.get('companyCode'),
    dueDate: f.get('dueDate'),
    docName: f.get('docName'),
    linkFile: f.get('linkFile'),
    modifiedBy: fullName(state.user),
    modifiedDate: nowStr(),
  };
  const res = await apiCall('updateDocument', patch);
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  const doc = state.documents.find(x=>x.id===id);
  if(doc) Object.assign(doc, patch);
  state.approvalDocEditId = null;
  showToast('บันทึกการแก้ไขเอกสารเรียบร้อย');
  render();
}

function pvBatchInfo_(v){

function setPvCompany(v){ state.pvCompany = v; state.expandedRow=null; render(); }
async function processPaymentStage(id, decision){
  const v = state.paymentVouchers.find(x=>x.id===id);
  if(!v) return;
  if(!pvCanActOnStage(v)){ showToast('รายการนี้ถูกมอบหมายให้ผู้อื่นดำเนินการ คุณไม่มีสิทธิ์ทำรายการนี้'); return; }
  const noteEl = document.getElementById('pv-note-'+id);
  const note = noteEl ? noteEl.value : '';
  const cfg = {
    'รอผู้ตรวจสอบPayment': {actor:'reviewerBy', date:'reviewerDate', note:'reviewerNote', reject:'ตีกลับแก้ไข(ผู้ตรวจสอบPayment)', next:'รอผู้อนุมัติPayment', stageLabel:'ผู้ตรวจสอบ Payment'},
    'รอผู้อนุมัติPayment': {actor:'approverBy', date:'approverDate', note:'approverNote', reject:'ตีกลับแก้ไข(ผู้อนุมัติPayment)', next:null, stageLabel:'ผู้อนุมัติ Payment'},
  }[v.status];
  if(!cfg) return;
  if(decision==='reject' && !note.trim()){ showToast('กรุณาระบุเหตุผลที่ตีกลับในช่องบันทึกความเห็น เพื่อให้ผู้แก้ไขทราบว่าต้องแก้อะไร'); return; }
  const patch = { id };
  if(decision==='approve'){
    patch[cfg.actor] = fullName(state.user);
    patch[cfg.date] = nowStr();
    if(note && note.trim()) patch[cfg.note] = note.trim();
    if(cfg.next){
      patch.status = cfg.next;
    } else {
      // final signer (ผู้อนุมัติ Payment) just approved -> lock the batch, only Admin can unlock
      patch.status = 'Complete';
      patch.locked = 'TRUE';
      patch.lockedBy = fullName(state.user);
      patch.lockedDate = nowStr();
    }
  } else {
    patch.status = cfg.reject;
    if(note && note.trim()) patch[cfg.note] = note.trim();
  }
  let history = [];
  try{ history = v.historyLog ? JSON.parse(v.historyLog) : []; }catch(e){ history = []; }
  history.push({ stage: cfg.stageLabel, actor: fullName(state.user), date: nowStr(), note: (note&&note.trim())?note.trim():'', action: decision==='approve'?'approve':'reject' });
  patch.historyLog = JSON.stringify(history);

  showBusyOverlay(decision==='approve' ? 'กำลังบันทึกการอนุมัติ กรุณารอสักครู่...' : 'กำลังบันทึกการตีกลับ กรุณารอสักครู่...');
  const res = await apiCall('updatePaymentVoucher', patch);
  hideBusyOverlay();
  if(!res.success){ showToast('ดำเนินการไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  state.expandedRow = null;
  showToast(decision==='approve' ? 'บันทึกการอนุมัติเรียบร้อย' : 'ตีกลับแล้ว');
  await refreshData();
  render();
}

// finance withdraws a batch that was sent back to them: every document returns to รอชำระเงิน so they can be re-grouped
async function cancelRejectedPv(id){
  const v = state.paymentVouchers.find(x=>x.id===id);
  if(!v || v.status!=='ตีกลับแก้ไข(ผู้ตรวจสอบPayment)'){ showToast('ยกเลิกได้เฉพาะชุดที่ถูกตีกลับมาให้การเงิน'); return; }

async function processStage(id, decision){
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  if(!canActOnStage(doc)){ showToast('เอกสารนี้ถูกมอบหมายให้ผู้อื่นดำเนินการ คุณไม่มีสิทธิ์ทำรายการนี้'); return; }
  const noteEl = document.getElementById('note-'+id);
  const note = noteEl ? noteEl.value : '';
  const sapEl = document.getElementById('sap-'+id);
  const webDocNoEl = document.getElementById('webDocNo-'+id);
  const vendorEl = document.getElementById('vendor-'+id);
  const vendorNameEl = document.getElementById('vendorName-'+id);
  const skipApproverEl = document.getElementById('skipApprover-'+id);
  const skipFinanceEl = document.getElementById('skipFinance-'+id);
  const skipApprover = isReceivableDoc_(doc) || (skipApproverEl ? skipApproverEl.checked : (doc.skipApprover==='TRUE'||doc.skipApprover===true));
  const skipFinance = isViaPaymentDoc_(doc) || (skipFinanceEl ? skipFinanceEl.checked : (doc.skipFinance==='TRUE'||doc.skipFinance===true));
  const payTypeEl = document.querySelector('input[name="payType-'+id+'"]:checked');

  // mandatory fields before the accountant can forward a document on to the reviewer
  if(decision==='approve' && doc.status==='รอนักบัญชี'){
    const sapVal = sapEl ? sapEl.value.trim() : (doc.docSAP||'');
    const vendorVal = vendorEl ? vendorEl.value.trim() : (doc.vendor||'');
    const vendorNameVal = vendorNameEl ? vendorNameEl.value.trim() : (doc.vendorName||'');
    const missing = [];
    if(!sapVal) missing.push('Document SAP');
    if(!vendorVal) missing.push('Vendor');
    if(!vendorNameVal) missing.push('Vendor Name');
    if(!payTypeEl) missing.push('ประเภทการจ่าย');
    if(missing.length){ showToast('กรุณากรอกให้ครบก่อนส่งต่อผู้ตรวจสอบ: '+missing.join(', ')); return; }
  }

  // the parallel ผู้อนุมัติ2/3 stage has no single fixed actor field — which slot this action
  // stamps depends on which mapped person is acting (Admin falls back to whichever slot is
  // still pending) — resolve that first so it can drive both cfg below and the "are we all
  // done yet" check further down.
  let my2Slot = null;
  if(doc.status==='รอผู้อนุมัติ2'){
    const slots2 = approver2Slots(doc);
    my2Slot = isAdmin() ? (slots2.find(s=>!s.signedBy) || slots2[0] || null) : (slots2.find(s=>s.id===state.user.id) || null);
    if(!my2Slot){ showToast('ไม่พบสิทธิ์การอนุมัติของท่านในขั้นตอนนี้'); return; }
  }
  const cfg = {
    'รอนักบัญชี': {actor:'accountantBy', date:'accountantDate', note:'accountantNote', reject:'ตีกลับแก้ไข(นักบัญชี)'},
    'รอผู้ตรวจสอบ': {actor:'reviewerBy', date:'reviewerDate', note:'reviewerNote', reject:'ตีกลับแก้ไข(ผู้ตรวจสอบ)'},
    'รอผู้อนุมัติ': {actor:'approverBy', date:'approverDate', note:'approverNote', reject:'ตีกลับแก้ไข(ผู้อนุมัติ)'},
    'รอผู้อนุมัติ2': my2Slot ? {actor:'approver'+my2Slot.slot+'By', date:'approver'+my2Slot.slot+'Date', note:'approver'+my2Slot.slot+'Note', reject:'ตีกลับแก้ไข(ผู้อนุมัติ2)'} : null,
  }[doc.status];
  if(!cfg) return;
  const patch = { id, modifiedBy: fullName(state.user), modifiedDate: nowStr() };
  if(decision==='approve'){
    // only stamp the "signed" actor/date fields on an actual approval — these are what the
    // printed reports use to decide whose signature/name to show, so rejecting must never
    // populate them (a reject is not a sign-off).
    patch[cfg.actor] = fullName(state.user);
    patch[cfg.date] = nowStr();
    // reviewer is standing in as the approver too (skip-approver flag) — stamp both
    // sign-offs together so the printed reports show both signatures for this one action
    if(doc.status==='รอผู้ตรวจสอบ' && skipApprover){
      patch.approverBy = fullName(state.user);
      patch.approverDate = nowStr();
    }
  }
  if(note && note.trim()){ patch[cfg.note] = appendNoteText(doc[cfg.note], note); }
  if(sapEl){ patch.docSAP = sapEl.value.trim(); }
  if(webDocNoEl){ patch.webDocNo = webDocNoEl.value.trim(); }
  if(vendorEl){ patch.vendor = vendorEl.value.trim(); }
  if(vendorNameEl){ patch.vendorName = vendorNameEl.value.trim(); }
  const manualBankAccountEl1 = document.getElementById('manualBankAccount-'+id);
  const manualBankNameEl1 = document.getElementById('manualBankName-'+id);
  if(manualBankAccountEl1) patch.manualBankAccount = manualBankAccountEl1.value.trim();
  if(manualBankNameEl1) patch.manualBankName = manualBankNameEl1.value.trim();
  // only write the flags back when their checkbox was actually shown on this form (accountant/reviewer stage),
  // so the approver stage (which has no checkboxes) never overwrites what was decided earlier
  if(skipApproverEl) patch.skipApprover = skipApprover ? 'TRUE' : '';
  if(skipFinanceEl) patch.skipFinance = skipFinance ? 'TRUE' : '';
  if(payTypeEl) patch.payType = payTypeEl.value;

  if(decision!=='approve'){
    patch.status = cfg.reject;
  } else if(doc.status==='รอนักบัญชี'){
    patch.status = 'รอผู้ตรวจสอบ';
  } else if(doc.status==='รอผู้ตรวจสอบ'){
    // skipApprover means no separate approver sign-off is needed at all for this document,
    // so it bypasses the ผู้อนุมัติ2/3 tier(s) too, same as it bypasses ผู้อนุมัติ(1)
    if(skipApprover){
      patch.status = afterApprovalStatus_(doc, skipFinance);
    } else {
      // always go to ผู้อนุมัติ (1) first — the ผู้อนุมัติ 2/3 tier only comes AFTER ผู้อนุมัติ (1) signs
      patch.status = 'รอผู้อนุมัติ';
    }
  } else if(doc.status==='รอผู้อนุมัติ'){
    patch.status = approver2Slots(doc).length ? 'รอผู้อนุมัติ2' : afterApprovalStatus_(doc, skipFinance);
  } else if(doc.status==='รอผู้อนุมัติ2'){
    // move on only once every configured slot (approverId2 AND approverId3, when both are set)
    // has signed off — my2Slot just got stamped above, so treat it as already-signed here
    const stillPending = approver2Slots(doc).some(s => s.id!==my2Slot.id && !s.signedBy);
    patch.status = stillPending ? 'รอผู้อนุมัติ2' : afterApprovalStatus_(doc, skipFinance);
  }

  const stageLabel = {'รอนักบัญชี':'นักบัญชี','รอผู้ตรวจสอบ':'ผู้ตรวจสอบ','รอผู้อนุมัติ':'ผู้อนุมัติ'}[doc.status]
    || (doc.status==='รอผู้อนุมัติ2' && my2Slot ? ('ผู้อนุมัติ'+my2Slot.slot) : doc.status);
  patch.historyLog = appendHistoryLog(doc, {
    stage: stageLabel,
    actor: fullName(state.user),
    date: nowStr(),
    note: (note && note.trim()) ? note.trim() : '',
    action: decision==='approve' ? 'approve' : 'reject',
  });

  showBusyOverlay(decision==='approve' ? 'กำลังบันทึกการอนุมัติ กรุณารอสักครู่...' : 'กำลังบันทึกการตีกลับ กรุณารอสักครู่...');
  const res = await apiCall('updateDocument', patch);
  hideBusyOverlay();
  if(!res.success){ showToast('ดำเนินการไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  state.expandedRow = null;
  showToast(decision==='approve' ? 'ส่งต่อเอกสารเรียบร้อย' : 'ตีกลับเอกสารแล้ว');
  await refreshData();
  render();
}

/* ============================= AR: รอรับเงิน ============================= */
function receivePendingDocs_(){
  let list = state.documents.filter(d=>d.status==='รอรับเงิน');
  if(!isAdmin() && state.user.companyCodes && state.user.companyCodes.length) list = list.filter(d=>state.user.companyCodes.includes(d.companyCode));
  if(state.paymentCompany!=='all') list = list.filter(d=>d.companyCode===state.paymentCompany);
  return list;
}
function canConfirmReceive_(){ return ['เจ้าหน้าที่การเงิน','หัวหน้าแผนกการเงิน','ผู้อนุมัติการเงิน','Admin'].includes(state.user.role); }
function setPaymentTab(t){ state.paymentTab = t; render(); }
function payTabsHTML_(){
  const n = receivePendingDocs_().length;
  const cur = state.paymentTab==='receive' ? 'receive' : 'pay';
  return `<div class="tabs">
    <div class="tab ${cur==='pay'?'active':''}" onclick="setPaymentTab('pay')">รอชำระเงิน</div>
    <div class="tab ${cur==='receive'?'active':''}" onclick="setPaymentTab('receive')">เอกสารรอรับเงิน${pendingBadgeHTML(n)}</div>
  </div>`;
}
// one selectable "unit" = a whole single-line document, or ONE sub-line of a multi-line document
function receiveUnits_(d){
  const lines = parseSapLines(d);
  const num = v => parseFloat(v)||0;
  if(lines.length>1) return lines.filter(l=>!l.rvId).map(l=>({key:String(l.subId), docId:d.id, line:l, net:num(l.net)}));
  return [{key:String(d.id), docId:d.id, line:null, net:num(d.netAmount)}];
}
function receiveAllKeys_(){ return receivePendingDocs_().flatMap(d=>receiveUnits_(d).map(u=>u.key)); }

  const companyOpts = userCompanyOptions();

  const selSum = selUnits.reduce((t,u)=>t+u.net,0);
  const allChecked = allKeys.length>0 && allKeys.every(k=>sel.includes(k));
  const pendingTotal = list.reduce((t,d)=>t+receiveUnits_(d).reduce((x,u)=>x+u.net,0),0);
  const cb = (key,disabled) => canAct ? `<input type="checkbox" ${sel.includes(key)?'checked':''} ${noCompanyPicked||disabled?'disabled':''} onchange="toggleReceiveSelect('${key}')">` : '';
  const rows = list.length ? list.map(d=>{

    const multi = parseSapLines(d).length>1;

    const docCb = canAct ? `<input type="checkbox" ${allOfDoc?'checked':''} ${noCompanyPicked?'disabled':''} onchange="toggleReceiveDoc('${d.id}')">` : '';

    const head = `

      <td>${d.docName||'-'}${multi?`<div style="font-size:11px;color:var(--ink-soft);">รับแล้ว ${doneCnt}/${totalCnt} รายการ${someOfDoc&&!allOfDoc?' · เลือกบางรายการ':''}</div>`:''}</td>

      <td>${d.reviewerBy||'-'}</td>
      <td>${d.dueDate?fmtDate(d.dueDate):'-'}</td>
      <td style="white-space:nowrap;">${d.approverDate||d.reviewerDate?fmtDateTime(d.approverDate||d.reviewerDate):'-'}</td>
      <td style="text-align:right;">${multi?'':`<b>${money(d.netAmount)}</b>`}</td>

      <td style="text-align:center;">${cb(u.key)}</td>

  return `

    <div class="helper">เอกสารกลุ่มลูกหนี้การค้า (AR) ที่ผู้ตรวจสอบอนุมัติแล้ว — ติ๊กเลือกรายการที่ได้รับเงินแล้ว (เอกสารที่แตก Sub ID ติ๊กรับเป็นบางรายการได้ เอกสารจะ Complete เมื่อรับครบทุก Sub ID) แล้วกด "ยืนยันรับเงิน" · ยอดค้างรับ ${money(pendingTotal)} บาท · <a href="#" onclick="goView('report-receive');return false;" style="color:var(--blue);">ดูรายงานที่ Report Receive →</a></div>
    ${noCompanyPicked && list.length && canAct ? '<div class="helper" style="color:var(--stamp-red);">กรุณาเลือกบริษัทก่อน แล้วจึงติ๊กเลือกเพื่อยืนยันรับเงิน (1 RV ต่อ 1 บริษัท)</div>' : ''}
    ${canAct ? `<div class="batch-bar" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 12px;padding:10px 12px;background:var(--paper);border-radius:8px;">

      <button id="receive-confirm-btn" class="btn btn-sm btn-approve" ${(selUnits.length && (state.receiveDocSap||'').trim())?'':'disabled'} onclick="confirmReceiveBatch()">✓ ยืนยันรับเงิน</button>
    </div>` : '<div class="helper">เฉพาะเจ้าหน้าที่การเงินที่ยืนยันรับเงินได้</div>'}
    <div class="table-scroll">
    <table>
      <thead><tr><th style="width:32px;"><input type="checkbox" ${allChecked?'checked':''} ${noCompanyPicked||!canAct?'disabled':''} onchange="toggleSelectAllReceive(this.checked)" title="เลือกทั้งหมด"></th><th>ID</th><th>ประเภท</th><th>ชื่อเอกสาร</th><th>SAP</th><th>Vendor Name</th><th>ไฟล์</th><th>ผู้ตรวจสอบ</th><th>Due</th><th>ส่งมาเมื่อ</th><th style="text-align:right;">ยอดสุทธิ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}
function setReceiveDocSap(v){
  state.receiveDocSap = v;
  const b = document.getElementById('receive-confirm-btn');
  if(b) b.disabled = !(state.receiveSelected.length && String(v||'').trim());
}
function toggleReceiveSelect(key){
  const i = state.receiveSelected.indexOf(key);
  if(i>=0) state.receiveSelected.splice(i,1); else state.receiveSelected.push(key);
  render();
}
function toggleReceiveDoc(docId){
  const d = state.documents.find(x=>x.id===docId); if(!d) return;
  const keys = receiveUnits_(d).map(u=>u.key);
  const all = keys.every(k=>state.receiveSelected.includes(k));
  state.receiveSelected = state.receiveSelected.filter(k=>!keys.includes(k)).concat(all ? [] : keys);
  render();
}
function toggleSelectAllReceive(checked){
  state.receiveSelected = checked ? receiveAllKeys_() : [];
  render();
}
async function confirmReceiveBatch(){
  if(!canConfirmReceive_()) return;
  if(state.paymentCompany==='all'){ showToast('กรุณาเลือกบริษัทก่อน'); return; }
  const docs = receivePendingDocs_();
  const items = [], logs = {};
  let n = 0, sum = 0;
  const me = fullName(state.user), now = nowStr();
  docs.forEach(d=>{
    const picked = receiveUnits_(d).filter(u=>state.receiveSelected.includes(u.key));
    if(!picked.length) return;
    const multi = parseSapLines(d).length>1;
    items.push({ id:d.id, subIds: multi ? picked.map(u=>u.key) : [] });
    n += picked.length; sum += picked.reduce((t,u)=>t+u.net,0);
    logs[d.id] = appendHistoryLog(d, { stage:'การเงิน (รับเงิน)', actor: me, date: now, note: (multi ? 'รับเงิน: '+picked.map(u=>u.key).join(', ')+' · ' : '') + 'Doc SAP: '+String(state.receiveDocSap||'').trim(), action:'receive' });
  });
  if(!items.length){ showToast('กรุณาติ๊กเลือกรายการที่ได้รับเงินแล้ว'); return; }
  const docSap = String(state.receiveDocSap||'').trim();
  if(!docSap){ showToast('กรุณากรอก Doc SAP ก่อนยืนยันรับเงิน'); const i=document.getElementById('receive-docsap'); if(i) i.focus(); return; }
  const sumTxt = sum.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(!confirm('ยืนยันว่าได้รับเงินแล้ว '+n+' รายการ ยอดรวม '+sumTxt+' บาท\nDoc SAP: '+docSap+'\nใช่หรือไม่?\n\nระบบจะออกเลข RV (Receive Voucher) 1 เลข ให้ทุกรายการที่เลือก (เอกสารที่รับครบทุก Sub ID จะเป็น Complete)')) return;
  showBusyOverlay('กำลังบันทึกการรับเงิน กรุณารอสักครู่...');
  const res = await apiCall('confirmReceive', { items, companyCode: docs.find(d=>d.id===items[0].id).companyCode, receivedBy: me, receivedDate: now, modifiedBy: me, modifiedDate: now, historyLogs: logs, receiveDocSap: docSap });
  hideBusyOverlay();
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'+(res.error?' ('+res.error+')':'')); return; }
  state.receiveSelected = [];
  state.receiveDocSap = '';
  showToast('ยืนยันรับเงิน '+n+' รายการเรียบร้อย'+(res.receiveVoucherId?' — เลขที่ '+res.receiveVoucherId:''));
  await refreshData();
  render();
}

/* ---- Report Receive: every Receive Voucher (RV) ever confirmed ---- */
function receiveReportEntries_(){
  const num = v => parseFloat(v)||0;
  let docs = state.documents.slice();
  if(!isAdmin() && state.user.companyCodes && state.user.companyCodes.length) docs = docs.filter(d=>state.user.companyCodes.includes(d.companyCode));
  if(state.reportReceiveCompany!=='all') docs = docs.filter(d=>d.companyCode===state.reportReceiveCompany);
  const out = [];
  docs.forEach(d=>{
    const lines = parseSapLines(d);
    if(lines.length>1){
      lines.forEach(l=>{ if(l.rvId) out.push({rv:l.rvId, d, id:String(l.subId), sap:l.fiDoc, vendor:l.vendor, vendorName:l.vendorName, vat:num(l.vat), wht:num(l.wht), base:num(l.base), net:num(l.net), by:l.receivedBy||d.receivedBy, date:l.receivedDate||d.receivedDate, rcvSap:l.receiveDocSap||d.receiveDocSap||''}); });
    } else if(d.receiveVoucherId){
      out.push({rv:String(d.receiveVoucherId).split(',').pop().trim(), d, id:displayId(d.id), sap:d.docSAP, vendor:d.vendor, vendorName:d.vendorName, vat:num(d.vatAmount), wht:num(d.whtAmount), base:num(d.baseAmount), net:num(d.netAmount), by:d.receivedBy, date:d.receivedDate, rcvSap:d.receiveDocSap||''});
    }
  });
  const s = state.reportReceiveSearch;
  let r = out;
  if(s.rv && s.rv.trim()) r = r.filter(e=>String(e.rv).toLowerCase().includes(s.rv.trim().toLowerCase()));
  if(s.by && s.by.trim()) r = r.filter(e=>String(e.by||'').toLowerCase().includes(s.by.trim().toLowerCase()));
  if(s.from){ const f = new Date(s.from).getTime(); r = r.filter(e=>dtMs_(e.date)>=f); }
  if(s.to){ const t = new Date(s.to).getTime()+86399999; r = r.filter(e=>dtMs_(e.date)<=t); }
  return r;
}
function receiveBatches_(entries){
  const b = {};
  entries.forEach(e=>{
    if(!b[e.rv]) b[e.rv] = { rv:e.rv, items:[], vat:0, wht:0, base:0, net:0, by:e.by, date:e.date, company:e.d.companyCode, dues:new Set(), saps:new Set() };
    const x = b[e.rv]; x.items.push(e); x.vat+=e.vat; x.wht+=e.wht; x.base+=e.base; x.net+=e.net;
    if(e.d.dueDate) x.dues.add(e.d.dueDate);
    if(e.rcvSap) x.saps.add(e.rcvSap);
  });
  return Object.values(b).sort((a,c)=>(dtMs_(c.date)>=9e15?-1:dtMs_(c.date))-(dtMs_(a.date)>=9e15?-1:dtMs_(a.date)) || String(c.rv).localeCompare(String(a.rv)));
}

function setReportReceiveSearch(f,v){ state.reportReceiveSearch[f] = v; render(); }

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <h3 style="margin-top:4px;">รายงานการรับเงิน (Receive Voucher)</h3>

      const editBtn = !canEditVoucherReport() ? '' : !editing

    return header+rows;
  }).join('') : `<tr class="empty-row"><td colspan="14">ไม่พบเอกสาร</td></tr>`;

  const actionBar = `

    <div style="font-size:13px;">

  return `

    <div class="helper">แสดงเฉพาะเอกสารที่ผู้อนุมัติ (ผจก.) อนุมัติแล้วเท่านั้น (รอชำระเงิน/Complete) — ติ๊กเลือกเอกสารที่ต้องการรวมเป็นใบสรุปเดียว แล้วกดออกใบสรุป — เป็นรายงานสำหรับดูอ้างอิงเท่านั้น ไม่เปลี่ยนสถานะเอกสารหรือส่งไปหน้าอื่นใดๆ</div>

function setVoucherReportCompany(v){ state.voucherReportCompany = v; state.voucherReportSelected=[]; render(); }
function setVoucherReportSearch(field, val){ state.voucherReportSearch[field] = val; render(); }
function clearVoucherReportSearch(){ state.voucherReportSearch = {type:'', name:'', due:'', createdBy:''}; render(); }
function setVoucherReportTitle(v){ state.voucherReportTitle = v; }
function toggleVoucherEditRow(id){
  if(!canEditVoucherReport()){ showToast('เฉพาะหัวหน้าแผนกบัญชีเท่านั้นที่แก้ไขได้'); return; }
  state.voucherEditRow = id;
  render();
}
function cancelVoucherEditRow(){ state.voucherEditRow = null; render(); }
async function saveVoucherEditRow(id){
  if(!canEditVoucherReport()){ showToast('เฉพาะหัวหน้าแผนกบัญชีเท่านั้นที่แก้ไขได้'); return; }
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  const sapEl = document.getElementById('ved-sap-'+id);
  const vatEl = document.getElementById('ved-vatAmount-'+id);
  const whtEl = document.getElementById('ved-whtAmount-'+id);
  const baseEl = document.getElementById('ved-baseAmount-'+id);
  const netEl = document.getElementById('ved-netAmount-'+id);
  const patch = {
    id,
    docSAP: sapEl ? sapEl.value.trim() : doc.docSAP,
    vatAmount: vatEl ? unformatMoney(vatEl.value) : doc.vatAmount,
    whtAmount: whtEl ? unformatMoney(whtEl.value) : doc.whtAmount,
    baseAmount: baseEl ? unformatMoney(baseEl.value) : doc.baseAmount,
    netAmount: netEl ? unformatMoney(netEl.value) : doc.netAmount,
    modifiedBy: fullName(state.user), modifiedDate: nowStr(),
  };
  showBusyOverlay('กำลังบันทึกการแก้ไข กรุณารอสักครู่...');
  const res = await apiCall('updateDocument', patch);
  hideBusyOverlay();
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  Object.assign(doc, patch);
  state.voucherEditRow = null;
  showToast('บันทึกการแก้ไขเรียบร้อย');
  render();
}
function toggleVoucherReportSelect(id){
  const i = state.voucherReportSelected.indexOf(id);
  if(i===-1) state.voucherReportSelected.push(id); else state.voucherReportSelected.splice(i,1);
  render();
}
function toggleSelectAllVoucherReport(checked){
  let list = state.documents.filter(d=>d.status==='รอชำระเงิน' || d.status==='Complete');
  if(!isAdmin() && state.user.companyCodes && state.user.companyCodes.length){
    list = list.filter(d=>state.user.companyCodes.includes(d.companyCode));
  }
  if(state.voucherReportCompany!=='all') list = list.filter(d=>d.companyCode===state.voucherReportCompany);
  const s = state.voucherReportSearch;
  if(s.type) list = list.filter(d=>d.docType===s.type);
  if(s.name && s.name.trim()) list = list.filter(d=>d.docName.toLowerCase().includes(s.name.trim().toLowerCase()));
  if(s.due) list = list.filter(d=>normalizeDateOnly(d.dueDate)===s.due);
  if(s.createdBy && s.createdBy.trim()) list = list.filter(d=>d.createdBy.toLowerCase().includes(s.createdBy.trim().toLowerCase()));

}
async function exportVoucherReportToExcel(){
  const docs = state.documents.filter(d=>state.voucherReportSelected.includes(d.id));
  if(!docs.length){ showToast('กรุณาเลือกเอกสารก่อน'); return; }
  if(typeof ExcelJS === 'undefined'){ showToast('โหลดไลบรารี Excel ไม่สำเร็จ ลองรีเฟรชหน้าเว็บแล้วลองใหม่'); return; }

  // flatten by SAP line, same logic as the printed PDF summary
  const lineRows = [];
  docs.forEach(d=>{
    const lines = parseSapLines(d);
    if(lines.length>1){
      lines.forEach(l=>{
        const vRec = findVendor_(d.companyCode, l.vendor);
        lineRows.push([d.id, docTypeInfo(d.docType).label, d.docName, l.fiDoc||'-', d.webDocNo||'-', l.vendor||'-', l.vendorName||'-', payTypeLabel(d.payType), (vRec&&vRec.bankAccount)||'-', (vRec&&vRec.bankName)||'-', l.vat||0, l.wht||0, l.base||0, l.net||0]);
      });
    } else {
      const bankAcct = vendorBankAccountFor(d), bankName = vendorBankNameFor(d);
      lineRows.push([d.id, docTypeInfo(d.docType).label, d.docName, d.docSAP||'-', d.webDocNo||'-', d.vendor||'-', d.vendorName||'-', payTypeLabel(d.payType), bankAcct||'-', bankName||'-', parseFloat(d.vatAmount)||0, parseFloat(d.whtAmount)||0, parseFloat(d.baseAmount)||0, parseFloat(d.netAmount)||0]);
    }
  });
  const totals = lineRows.reduce((t,r)=>({vat:t.vat+r[10], wht:t.wht+r[11], base:t.base+r[12], net:t.net+r[13]}), {vat:0,wht:0,base:0,net:0});

  const companyCode = docs[0].companyCode || '';
  const title = state.voucherReportTitle.trim();
  const COLS = 14;
  const thin = {style:'thin', color:{argb:'FFB9B2A0'}};
  const border = {top:thin, left:thin, bottom:thin, right:thin};
  const navy = 'FF152238';
  const paper = 'FFFBF8F1';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('ใบสำคัญจ่าย');
  ws.columns = [
    {width:8},{width:14},{width:30},{width:16},{width:18},{width:12},{width:20},{width:12},{width:14},{width:20},{width:10},{width:10},{width:12},{width:12}
  ];

  let r = 1;
  ws.mergeCells(r,1,r,COLS);
  ws.getCell(r,1).value = 'ใบสรุปใบสำคัญจ่าย';
  ws.getCell(r,1).font = {bold:true, size:16, name:'Tahoma'};
  ws.getCell(r,1).alignment = {horizontal:'center'};
  r += 2;

  ws.getCell(r,1).value = `Company Code: ${companyCode} — ${companyName(companyCode)}`;
  ws.getCell(r,1).font = {bold:true, size:11, name:'Tahoma'};
  ws.mergeCells(r,1,r,COLS);
  r++;
  if(title){
    ws.getCell(r,1).value = `อ้างอิง: ${title}`;
    ws.getCell(r,1).font = {size:11, name:'Tahoma'};
    ws.mergeCells(r,1,r,COLS);
    r++;
  }
  ws.getCell(r,1).value = `จำนวนเอกสาร: ${docs.length} รายการ · ออกโดย: ${fullName(state.user)} · วันที่ออกรายงาน: ${fmtDate(new Date())}`;
  ws.getCell(r,1).font = {size:11, name:'Tahoma'};
  ws.mergeCells(r,1,r,COLS);
  r += 2;

  const headerRowIdx = r;
  const headers = ['ID','ประเภท','ชื่อเอกสาร','SAP','Web Doc No.','Vendor','Vendor Name','ประเภทการจ่าย','เลขที่บัญชี','ธนาคาร','VAT Amt','WHT Amt','Base Amt','ยอดจ่ายสุทธิ'];
  headers.forEach((h,i)=>{
    const cell = ws.getCell(headerRowIdx, i+1);
    cell.value = h;
    cell.font = {bold:true, color:{argb:'FFFFFFFF'}, name:'Tahoma', size:10.5};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:navy}};
    cell.border = border;
    cell.alignment = {vertical:'middle', horizontal: i>=10 ? 'right' : 'left'};
  });
  r++;

  const moneyFmt = '#,##0.00';
  lineRows.forEach((row, idx)=>{
    row.forEach((val,i)=>{
      const cell = ws.getCell(r, i+1);
      cell.value = val;
      cell.border = border;
      cell.font = {name:'Tahoma', size:10.5};
      if(i>=10){ cell.numFmt = moneyFmt; cell.alignment = {horizontal:'right'}; }
      if(idx % 2 === 1) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:paper}};
    });
    r++;
  });

  // totals row
  ws.mergeCells(r,1,r,10);
  const totalLabelCell = ws.getCell(r,1);
  totalLabelCell.value = 'รวม';
  totalLabelCell.font = {bold:true, name:'Tahoma', size:10.5};
  totalLabelCell.alignment = {horizontal:'right'};
  [totals.vat, totals.wht, totals.base, totals.net].forEach((v,i)=>{
    const cell = ws.getCell(r, 11+i);
    cell.value = v;
    cell.numFmt = moneyFmt;
    cell.font = {bold:true, name:'Tahoma', size:10.5};
    cell.alignment = {horizontal:'right'};
  });
  for(let c=1;c<=COLS;c++){ ws.getCell(r,c).border = {top:{style:'double', color:{argb:'FF152238'}}}; }
  r += 3;

  // signature blocks (4 columns of roughly equal width, matching the printed PDF report)
  const blocks = [
    {cols:[1,4], label:'ต้นฉบับอยู่ฝ่ายบัญชี', name:'', role:'', dateLine:true},
    {cols:[5,7], label:'ผู้จัดเตรียม', name: docs[docs.length-1].accountantBy||'', role:'นักบัญชี'},
    {cols:[8,10], label:'ผู้ตรวจสอบ', name: docs[docs.length-1].reviewerBy||'', role:'ผู้ตรวจสอบ'},
    {cols:[11,14], label:'ผู้อนุมัติ', name: docs[docs.length-1].approverBy||'', role:'ผู้อนุมัติ'},
  ];
  const labelRow = r;
  blocks.forEach(b=>{
    ws.mergeCells(labelRow,b.cols[0],labelRow,b.cols[1]);
    const cell = ws.getCell(labelRow,b.cols[0]);
    cell.value = b.label;
    cell.font = {name:'Tahoma', size:10.5};
    cell.alignment = {horizontal:'center'};
  });
  r += 3;
  const lineRow = r;
  blocks.forEach(b=>{
    for(let c=b.cols[0]; c<=b.cols[1]; c++){ ws.getCell(lineRow,c).border = {top:{style:'thin', color:{argb:'FF333333'}}}; }
  });
  r++;
  const nameRow = r;
  blocks.forEach(b=>{
    ws.mergeCells(nameRow,b.cols[0],nameRow,b.cols[1]);
    const cell = ws.getCell(nameRow,b.cols[0]);
    cell.value = b.dateLine ? fmtDate(new Date()) : (b.name||'-');
    cell.font = {name:'Tahoma', size:10.5};
    cell.alignment = {horizontal:'center'};
  });
  if(blocks.some(b=>b.role)){
    r++;
    const roleRow = r;
    blocks.forEach(b=>{
      if(!b.role) return;
      ws.mergeCells(roleRow,b.cols[0],roleRow,b.cols[1]);
      const cell = ws.getCell(roleRow,b.cols[0]);
      cell.value = b.role;
      cell.font = {name:'Tahoma', size:9.5, color:{argb:'FF726C5E'}};
      cell.alignment = {horizontal:'center'};
    });
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ใบสำคัญจ่าย_'+new Date().toISOString().slice(0,10)+'.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}

  if(webDocNoEl) patch.webDocNo = webDocNoEl.value.trim();
  if(vendorEl) patch.vendor = vendorEl.value.trim();
  if(vendorNameEl) patch.vendorName = vendorNameEl.value.trim();
  const manualBankAccountEl3 = document.getElementById('manualBankAccount-'+id);
  const manualBankNameEl3 = document.getElementById('manualBankName-'+id);
  if(manualBankAccountEl3) patch.manualBankAccount = manualBankAccountEl3.value.trim();
  if(manualBankNameEl3) patch.manualBankName = manualBankNameEl3.value.trim();

  if(skipFinanceEl) patch.skipFinance = skipFinanceEl.checked ? 'TRUE' : '';
  if(payTypeEl) patch.payType = payTypeEl.value;

  showBusyOverlay('กำลังบันทึกการแก้ไข กรุณารอสักครู่...');

  hideBusyOverlay();
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  Object.assign(doc, patch);
  showToast('บันทึกการแก้ไขเรียบร้อย — กดปุ่มดาวน์โหลด/ตรวจสอบตัวเลขได้เลย ยังไม่ส่งต่อจนกว่าจะกดปุ่มอนุมัติ');
  await refreshData();
  render();
}

function setPaymentSkipReason(v){ state.paymentSkipReason = v; if(v!=='อื่นๆ') state.paymentSkipOther=''; render(); }
async function confirmBatchPayment(){
  const docNum = state.paymentDocNumber.trim();
  const docLink = state.paymentDocLink.trim();
  if(!docNum || !state.paymentSelected.length) return;
  const payAcc = accountsForCompany_(state.paymentCompany).find(a=>a.accountNo===state.paymentAccountNo);
  if(!payAcc){ showToast('กรุณาเลือกบัญชีที่โอนของบริษัทนี้ก่อนยืนยันรวบจ่าย'); return; }
  if(state.paymentCompany==='all'){ showToast('กรุณาเลือกบริษัทก่อนรวบจ่าย ห้ามรวบจ่ายข้ามบริษัทในใบเดียวกัน'); return; }
  const ids = state.paymentSelected.slice();
  const selectedDocs = ids.map(id=>state.documents.find(d=>d.id===id)).filter(Boolean);
  const companySet = new Set(selectedDocs.map(d=>d.companyCode));
  if(companySet.size > 1){ showToast('พบเอกสารจากหลายบริษัทในรายการที่เลือก ห้ามรวบจ่ายข้ามบริษัท กรุณาตรวจสอบอีกครั้ง'); return; }
  const skipReason = state.paymentSkipReason==='อื่นๆ' ? (state.paymentSkipOther||'').trim() : state.paymentSkipReason;
  if(state.paymentSkipReason==='อื่นๆ' && !skipReason){ showToast('กรุณาระบุเหตุผลที่ข้ามผู้ตรวจสอบ Payment'); return; }
  if(skipReason && !confirm('ยืนยันข้ามผู้ตรวจสอบ Payment และส่งตรงไปผู้อนุมัติ Payment ใช่หรือไม่?\n\nเหตุผล: '+skipReason)) return;
  showBusyOverlay('กำลังดำเนินการรวบชุดจ่าย กรุณารอสักครู่... (0/'+ids.length+')');
  let done = 0;
  for(const id of ids){
    const doc = state.documents.find(d=>d.id===id);
    if(!doc) continue;
    const patch = {
      id, status:'Complete', docPayment: docNum, docPaymentLink: docLink,
      paymentBy: fullName(state.user), paymentDate: nowStr(), timeApprove: nowStr(),
      modifiedBy: fullName(state.user), modifiedDate: nowStr(),
    };
    const res = await apiCall('updateDocument', patch);
    if(!res.success){ hideBusyOverlay(); showToast('บันทึกการจ่ายเงินไม่สำเร็จที่เอกสาร '+displayId(id)+' ลองใหม่อีกครั้ง'); await refreshData(); render(); return; }
    done++;
    showBusyOverlay('กำลังดำเนินการรวบชุดจ่าย กรุณารอสักครู่... ('+done+'/'+ids.length+')');
  }
  // Create (or extend) the separate Payment Voucher close-out record for this batch — this is
  // a brand-new approval layer on top of the Documents flow above and never touches a
  // Document's own status/fields; triggered the moment the batch is confirmed here.
  const pvCompanyCode = selectedDocs[0] ? selectedDocs[0].companyCode : state.paymentCompany;
  const netTotal = selectedDocs.reduce((sum,d)=>sum+(parseFloat(d.netAmount)||0),0);
  let pvFailed = false;
  const existingPv = state.paymentVouchers.find(v=>v.status!=='ยกเลิก' && String(v.docPayment)===String(docNum) && String(v.companyCode)===String(pvCompanyCode));
  if(existingPv){
    if(existingPv.locked==='TRUE'){
      showToast('หมายเหตุ: Doc Payment นี้ปิดรอบ Payment ไปแล้ว เอกสารที่เพิ่มใหม่จะไม่ถูกรวมในชุดปิดรอบเดิม กรุณาแจ้ง Admin หากต้องการปลดล็อกเพื่อรวมเพิ่ม');
    } else {
      const mergedIds = Array.from(new Set(pvDocIds(existingPv).concat(ids)));
      const mergePatch = { id: existingPv.id, docIds: JSON.stringify(mergedIds), netTotal: String(netTotal) };
      if(!existingPv.payAccountNo){ mergePatch.payAccountNo = payAcc.accountNo; mergePatch.payAccountOwner = payAcc.owner; }
      const upRes = await apiCall('updatePaymentVoucher', mergePatch);
      if(!upRes || !upRes.success) pvFailed = true;
    }
  } else {
    const pvRes = await apiCall('createPaymentVoucher', { docPayment: docNum, companyCode: pvCompanyCode, payAccountNo: payAcc.accountNo, docIds: ids, netTotal: String(netTotal), createdBy: fullName(state.user), skipReviewerReason: skipReason||'' });
    if(!pvRes || !pvRes.success) pvFailed = true;
  }
  hideBusyOverlay();
  if(pvFailed){
    alert('บันทึกการรวบจ่ายสำเร็จ แต่สร้างชุดปิดรอบ Payment (ส่งต่อผู้ตรวจสอบ Payment) ไม่สำเร็จ\n\nDoc Payment: '+docNum+'\nกรุณาแจ้ง Admin — มักเกิดจาก Apps Script ยังไม่ได้ Deploy เวอร์ชันล่าสุด หรือไม่มีชีท PaymentVouchers');
  } else {
    showToast('บันทึกการรวบจ่ายเรียบร้อย · Doc Payment '+docNum+' ('+ids.length+' รายการ) · ส่งต่อ'+(skipReason?'ผู้อนุมัติ':'ผู้ตรวจสอบ')+' Payment แล้ว');
  }
  state.paymentSelected = [];
  state.paymentDocNumber = '';
  state.paymentDocLink = '';
  state.paymentAccountNo = '';
  state.paymentSkipReason = ''; state.paymentSkipOther = '';
  await refreshData();
  render();
  openPaymentReport(docNum);
}

// paymentDate / accountantDate etc are stored via nowStr() = Date#toLocaleString('th-TH'),
// e.g. "14/7/2569 00:35:42" — day/month/BuddhistYear. Parse back to a real Date for range filtering.
function parseThaiDateStr(str){
  if(!str) return null;
  const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  const day = parseInt(m[1],10), month = parseInt(m[2],10), buddhistYear = parseInt(m[3],10);
  const d = new Date(buddhistYear-543, month-1, day);
  return isNaN(d.getTime()) ? null : d;
}

  if(s.from){ const from = new Date(s.from); docs = docs.filter(d=>{ const dt = parseThaiDateStr(d.paymentDate); return dt && dt >= from; }); }
  if(s.to){ const to = new Date(s.to); to.setHours(23,59,59,999); docs = docs.filter(d=>{ const dt = parseThaiDateStr(d.paymentDate); return dt && dt <= to; }); }

  const num = v => parseFloat(v)||0;
  const batches = {};

    const key = String(d.docPayment);
    if(!batches[key]) batches[key] = { docPayment:d.docPayment, count:0, vat:0, wht:0, base:0, net:0, paymentDate:d.paymentDate||'', paymentBy:d.paymentBy||'', companyCode:d.companyCode||'', payTypes:new Set(), docPaymentLink:d.docPaymentLink||'', dues:new Set() };
    const b = batches[key];
    b.count++;
    b.vat += num(d.vatAmount); b.wht += num(d.whtAmount); b.base += num(d.baseAmount); b.net += num(d.netAmount);
    if(d.payType) b.payTypes.add(d.payType);
    if(d.dueDate) b.dues.add(d.dueDate);
    if(d.docPaymentLink) b.docPaymentLink = d.docPaymentLink;
    if(dtMs_(d.paymentDate||'') > dtMs_(b.paymentDate||'')) b.paymentDate = d.paymentDate;
  });
  // newest batch first (real date-time compare; Thai D/M/BE strings can't be sorted as text)
  const batchList = Object.values(batches).sort((a,b)=>{ const x=dtMs_(a.paymentDate), y=dtMs_(b.paymentDate); const ax = x>=9e15?-1:x, by = y>=9e15?-1:y; return by-ax || String(b.docPayment).localeCompare(String(a.docPayment)); });
  const dueFmt_ = v => { const t = dtMs_(v); return t>=9e15 ? String(v) : fmtDate(new Date(t)); };
  const batchDueLabel = b => { const arr=[...b.dues].sort((x,y)=>dtMs_(x)-dtMs_(y)); return !arr.length ? '-' : (arr.length===1 ? dueFmt_(arr[0]) : dueFmt_(arr[0])+' – '+dueFmt_(arr[arr.length-1])); };
  batchList.forEach(b=>{ b.stage = pvStageOfBatch_(b.docPayment); });
  const cntReview = batchList.filter(b=>b.stage.key==='review').length;
  const cntApprove = batchList.filter(b=>b.stage.key==='approve').length;
  const allBatches = batchList.slice();
  if(state.reportStatus==='review' || state.reportStatus==='approve' || state.reportStatus==='done'){
    for(let i=batchList.length-1;i>=0;i--) if(batchList[i].stage.key!==state.reportStatus) batchList.splice(i,1);
  }
  const batchPayTypeLabel = b => b.payTypes.size===0 ? '-' : (b.payTypes.size===1 ? payTypeLabel([...b.payTypes][0]) : 'หลายประเภท');

  const totalNet = allBatches.reduce((sum,b)=>sum+b.net,0);
