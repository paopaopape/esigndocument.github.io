<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบอนุมัติเอกสาร | Document Flow</title>
<script>try{var t=localStorage.getItem('dfTheme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --navy:#152238;
  --navy-light:#1F3358;
  --navy-lighter:#2A4270;
  --paper:#F3EEE1;
  --paper-white:#FBF8F1;
  --ink:#26241F;
  --ink-soft:#726C5E;
  --stamp-red:#A83A2C;
  --gold:#B8902A;
  --forest:#2E6B4E;
  --line:#E1D8C2;
  --blue:#2E5EAA;
  --purple:#7B4FA0;
  --orange:#BE6C17;
  --pink:#AE4270;
  --radius:9px;
  --shadow: 0 2px 10px rgba(21,34,56,0.10);
  --surface:#fff;
  --heading:var(--navy);
  --pill:#EDE6D2;
}
/* ---------- COLOUR THEMES (status colours, doc-type badges and icons keep their own colours in every theme) ---------- */
html[data-theme="green"]{--navy:#16382B;--navy-light:#21503D;--navy-lighter:#21503D;--paper:#EEF2E8;--paper-white:#F8FAF4;--ink:#1F2A22;--ink-soft:#64705F;--line:#D5DEC8;--gold:#C9A227;--pill:#E3EAD6;--shadow:0 2px 10px rgba(22,56,43,0.10);}
html[data-theme="ocean"]{--navy:#0F3B57;--navy-light:#18506F;--navy-lighter:#18506F;--paper:#EAF2F7;--paper-white:#F7FBFD;--ink:#1B2A33;--ink-soft:#5F7380;--line:#CFDFE9;--gold:#1F8FB8;--pill:#DCEAF2;--shadow:0 2px 10px rgba(15,59,87,0.10);}
html[data-theme="purple"]{--navy:#2E1F4D;--navy-light:#41306A;--navy-lighter:#41306A;--paper:#F1EDF6;--paper-white:#FAF8FD;--ink:#261F33;--ink-soft:#6F6683;--line:#DDD4EA;--gold:#B07AD0;--pill:#E6DEF1;--shadow:0 2px 10px rgba(46,31,77,0.10);}
html[data-theme="white"]{--navy:#1E293B;--navy-light:#334155;--navy-lighter:#334155;--paper:#FFFFFF;--paper-white:#FFFFFF;--ink:#1F2937;--ink-soft:#6B7280;--line:#E5E7EB;--gold:#2563EB;--pill:#F1F5F9;--shadow:0 1px 6px rgba(15,23,42,0.08);}
html[data-theme="dark"]{--navy:#0B1220;--navy-light:#141E33;--navy-lighter:#22304F;--paper:#1B2436;--paper-white:#232F46;--ink:#E8ECF4;--ink-soft:#9BA7BD;--line:#334058;--gold:#E0B34A;--pill:#2C3A55;--surface:#2C3A55;--heading:#E8ECF4;--shadow:0 2px 10px rgba(0,0,0,0.35);color-scheme:dark;}
html[data-theme="dark"] [style*="background:var(--surface)"],
html[data-theme="dark"] [style*="background:#FFF8E8"],
html[data-theme="dark"] [style*="background:#FDEDEC"],
html[data-theme="dark"] [style*="background:#FBE9E7"],
html[data-theme="dark"] [style*="background:#FFF8E1"],
html[data-theme="dark"] [style*="background:#FFF3E0"],
html[data-theme="dark"] [style*="background:#E8F5E9"],
html[data-theme="dark"] [style*="background:#E6F4EA"]{background:var(--surface) !important;color:var(--ink);}
html[data-theme="dark"] .calc-window{background:#2C3A55;}
html[data-theme="dark"] .link-cell a, html[data-theme="dark"] a{color:#8FB6F0;}
.sent-at{margin-top:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.theme-select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12px;}
*{box-sizing:border-box;}
@keyframes busy-spin{ to{ transform:rotate(360deg); } }
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;}
h1,h2,h3,h4{font-family:'Noto Serif Thai',serif;margin:0;color:var(--heading);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13.5px;}
::selection{background:var(--gold);color:#fff;}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(184,144,42,0.10), transparent 45%),
  radial-gradient(circle at 80% 80%, rgba(46,94,170,0.08), transparent 45%),
  var(--navy);padding:20px;}
.login-card{background:var(--paper-white);width:100%;max-width:400px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.35);overflow:hidden;}
.login-head{background:var(--navy);color:#fff;padding:28px 30px 22px;position:relative;}
.login-head::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--stamp-red),var(--forest));}
.login-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#C9A227;text-transform:uppercase;}
.login-head h1{color:#fff;font-size:22px;margin-top:6px;}
.login-body{padding:26px 30px 30px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field select, .field input, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.btn{border:none;border-radius:7px;padding:10px 18px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-block{width:100%;justify-content:center;padding:12px;}
.login-hint{margin-top:14px;font-size:12px;color:var(--ink-soft);line-height:1.6;background:var(--paper);border:1px dashed var(--line);padding:10px 12px;border-radius:7px;}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{width:236px;background:var(--navy);color:#EFE9DA;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease;}
.sidebar.collapsed{width:0;}
.sidebar-toggle{background:transparent;border:1px solid rgba(239,233,218,0.3);color:#EFE9DA;border-radius:6px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.sidebar-toggle:hover{background:rgba(239,233,218,0.12);}
.sidebar-expand-btn{position:fixed;top:16px;left:16px;z-index:600;width:32px;height:32px;border-radius:8px;background:var(--navy);color:#EFE9DA;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}
.sidebar-expand-btn:hover{background:var(--navy-light);}
.calc-fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,0.3);cursor:pointer;z-index:9000;display:flex;align-items:center;justify-content:center;}
.calc-fab:hover{background:var(--navy-light);}
.calc-window{position:fixed;display:none;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.35);z-index:9001;width:270px;min-width:230px;min-height:380px;resize:both;overflow:hidden;font-family:'IBM Plex Mono',monospace;border:1px solid var(--line);}
.calc-header{background:var(--navy);color:#fff;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;font-size:12px;font-weight:600;flex-shrink:0;}
.calc-header button{background:transparent;border:none;color:#fff;font-size:15px;cursor:pointer;padding:2px 6px;line-height:1;}
.calc-header button:hover{opacity:0.7;}
.calc-display{padding:16px 14px;text-align:right;font-size:26px;background:#F5F2EA;word-break:break-all;flex-shrink:0;border-bottom:1px solid var(--line);color:var(--navy);}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);flex:1;}
.calc-btn{background:#fff;border:none;font-size:16px;cursor:pointer;color:var(--navy);}
.calc-btn:hover{background:var(--paper);}
.calc-btn.calc-op{background:#EFE9DA;color:var(--navy);font-weight:600;}
.calc-btn.calc-eq{background:var(--gold);color:#fff;font-weight:700;}
.calc-btn.calc-clear{background:var(--stamp-red);color:#fff;}
.sidebar-brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-brand .mark{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.12em;}
.sidebar-brand h2{color:#fff;font-size:17px;margin-top:4px;}
.nav{padding:14px 10px;flex:1;overflow-y:auto;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8792A8;padding:14px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:#D8D2C1;font-size:13.5px;font-weight:500;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,0.06);cursor:pointer;}
.nav-item.active{background:var(--navy-lighter);color:#fff;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;}
.nav-sub{margin-left:14px;padding-left:10px;border-left:1px solid rgba(255,255,255,0.12);}
.nav-sub .nav-item{font-size:12.5px;padding:7px 12px;}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.08);font-size:11.5px;color:#8792A8;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--paper-white);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:19px;}
.topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.user-chip{display:flex;align-items:center;gap:10px;}
.user-chip .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Noto Serif Thai',serif;}
.user-chip .who{text-align:right;}
.user-chip .who .name{font-weight:600;font-size:13px;}
.user-chip .who .role{font-size:11.5px;color:var(--ink-soft);}
.logout-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:12px;color:var(--ink-soft);}
.logout-btn:hover{border-color:var(--stamp-red);color:var(--stamp-red);}

.content{padding:26px 28px 60px;overflow-y:auto;}
.card{background:var(--paper-white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px;}
.card h3{font-size:16px;margin-bottom:14px;}
.table-scroll{overflow-x:auto;}

/* ---------- DASHBOARD ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--paper-white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.stat-card:hover{border-color:var(--ink-soft);}
.stat-card.active{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset,var(--shadow);}
.stat-card .num{font-family:'Noto Serif Thai',serif;font-size:30px;color:var(--heading);font-weight:700;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.stat-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;}
.stat-card.s-accountant::before{background:var(--blue);}
.stat-card.s-reviewer::before{background:var(--orange);}
.stat-card.s-approver::before{background:var(--purple);}
.stat-card.s-finance::before{background:var(--gold);}
.stat-card.s-complete::before{background:var(--forest);}
.stat-card.s-reject::before{background:var(--stamp-red);}
.stat-card.s-cancel::before{background:var(--ink-soft);}

/* ---------- FILTER BAR ---------- */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;}
.filter-bar .f-field{min-width:150px;}
.filter-bar .f-field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.filter-bar input, .filter-bar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px;width:100%;}
.filter-clear{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;color:var(--ink-soft);height:33px;}
.filter-clear:hover{border-color:var(--stamp-red);color:var(--stamp-red);}

.company-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px 18px;background:var(--navy);border-radius:10px;color:#fff;flex-wrap:wrap;}
.company-header label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#C9A227;font-weight:700;}
.company-header select{padding:8px 12px;border-radius:6px;border:none;font-size:13px;min-width:260px;}

.group-header td{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:6px;}
.group-header .cnt{font-weight:400;color:#C9A227;margin-left:6px;}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
tbody td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr:hover{background:rgba(184,144,42,0.05);}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
.link-cell a{color:var(--blue);text-decoration:none;font-size:12.5px;}
.link-cell a:hover{text-decoration:underline;}
.empty-row td{text-align:center;padding:36px;color:var(--ink-soft);}
.comment-cell{max-width:220px;font-size:12px;color:var(--ink-soft);}
.sap-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;}
.sap-cell.empty{color:#B9B2A0;}

/* ---------- BADGES / STAMPS ---------- */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;}
.badge-blue{background:var(--blue);}
.badge-purple{background:var(--purple);}
.badge-orange{background:var(--orange);}
.badge-pink{background:var(--pink);}
.badge-gold{background:var(--gold);}
.badge-forest{background:var(--forest);}
.status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--pill);color:var(--ink);}
.status-pill.complete{background:var(--forest);color:#fff;transform:rotate(-2deg);box-shadow:0 1px 4px rgba(46,107,78,0.4);}
.status-pill.reject{background:var(--stamp-red);color:#fff;}
.status-pill.cancel{background:#726C5E;color:#fff;}

.trail{display:flex;align-items:center;gap:3px;}
.trail .stg{width:9px;height:9px;border-radius:50%;background:var(--line);border:1px solid #D8CDAE;}
.trail .stg.done{background:var(--forest);border-color:var(--forest);}
.trail .stg.current{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,144,42,0.25);}
.trail .bar{width:14px;height:2px;background:var(--line);}
.trail .bar.done{background:var(--forest);}
.trail-label{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}

/* ---------- FORMS / ACTIONS ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid .full{grid-column:1/-1;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.btn-approve{background:var(--forest);color:#fff;border:none;}
.btn-approve:hover{opacity:.9;}
.btn-reject{background:var(--surface);color:var(--stamp-red);border:1px solid var(--stamp-red);}
.btn-reject:hover{background:rgba(168,58,44,0.08);}
.btn-outline{background:var(--surface);color:var(--heading);border:1px solid var(--line);}
.btn-outline:hover{border-color:var(--navy);}
.btn-action{background:var(--navy);color:#fff;border:1px solid var(--navy);}
.btn-action:hover{background:var(--navy-light);}
.btn-cancel{background:var(--surface);color:var(--ink-soft);border:1px solid var(--ink-soft);}
.btn-cancel:hover{background:rgba(114,108,94,0.1);color:var(--ink);border-color:var(--ink);}
.action-row td{background:var(--paper);padding:14px 16px;}
.note-box{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
.note-box textarea{flex:1;min-width:220px;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;}
.note-box .sap-input{width:190px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;}
.note-box .sap-wrap label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn:hover{border-color:var(--heading);color:var(--heading);background:var(--paper);}
.icon-btn.edit-icon{color:var(--gold);border-color:rgba(184,144,42,0.45);}
.icon-btn.edit-icon:hover{background:rgba(184,144,42,0.1);border-color:var(--gold);color:var(--gold);}
.icon-btn.dl-icon{color:var(--purple);border-color:rgba(123,79,160,0.4);}
.icon-btn.dl-icon:hover{background:rgba(123,79,160,0.1);border-color:var(--purple);color:var(--purple);}
.icon-btn.ql-folder{color:var(--blue);border-color:rgba(46,94,170,0.4);}
.icon-btn.ql-folder:hover{background:rgba(46,94,170,0.1);border-color:var(--blue);color:var(--blue);}
.icon-btn.ql-payment{color:var(--forest);border-color:rgba(46,107,78,0.4);}
.icon-btn.ql-payment:hover{background:rgba(46,107,78,0.1);border-color:var(--forest);color:var(--forest);}
.icon-btn.ql-receipt{color:var(--orange);border-color:rgba(190,108,23,0.4);}
.icon-btn.ql-receipt:hover{background:rgba(190,108,23,0.1);border-color:var(--orange);color:var(--orange);}
.icon-btn.ql-wht{color:var(--pink);border-color:rgba(174,66,112,0.4);}
.icon-btn.ql-wht:hover{background:rgba(174,66,112,0.1);border-color:var(--pink);color:var(--pink);}
.icon-btn.sap-link{font-size:9px;font-weight:700;letter-spacing:.2px;color:var(--blue);}
.icon-btn.sap-link:hover{border-color:var(--blue);color:var(--blue);background:var(--paper);}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
.tab:hover{color:var(--heading);cursor:pointer;}
.tab-row{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.help-toggle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;vertical-align:2px;}
.help-toggle:hover{color:var(--heading);border-color:var(--gold);}
.tab.active{color:var(--heading);border-color:var(--gold);}

.chip-check{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;margin:3px 4px 3px 0;background:var(--surface);}
.chip-check input{margin:0;}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
.helper{color:var(--ink-soft);font-size:12.5px;margin-top:2px;margin-bottom:16px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.3);z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;}
.toast.show{opacity:1;transform:translateY(0);}
.role-tag{font-size:10.5px;background:var(--navy);color:#fff;padding:2px 8px;border-radius:20px;}
hr.div{border:none;border-top:1px solid var(--line);margin:18px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= DATA / CONSTANTS ============================= */
const ROLE_LABELS = {
  'User': 'User (ผู้ใช้งานทั่วไป)',

/* Document IDs are stored as "{companyCode}-D{seq}" so each company's running number is
   independent of every other company's (see handleAddDocument in Code.gs). Users should still
   only ever see the plain "D001"-style number — paired with the adjacent บริษัท column to tell
   companies apart — so every place an id reaches the screen goes through displayId() first.
   Old documents created before this change have no company prefix at all ("D001"..): displayId
   leaves those untouched since there's no dash to strip. */
function displayId(id){
  const s = String(id||'');
  const i = s.indexOf('-');
  return i===-1 ? s : s.slice(i+1);
}
/* Extracts the running sequence number out of an id for sorting/range-filtering, regardless of
   whether it carries a company-code prefix or not — "4040-D001" and "D001" both give 1. Picks
   the first "D<digits>" run found in the string. */
function docSeqNum(id){
  const m = String(id||'').match(/D(\d+)/);
  return m ? parseInt(m[1],10) : NaN;
}

function fmtDate(d){
  if(!d) return '-';
  try{
    const thaiParsed = parseThaiDateStr(d);
    const dt = thaiParsed || new Date(d);
    if(isNaN(dt.getTime())) return String(d);
    const day = String(dt.getDate()).padStart(2,'0');
    const month = String(dt.getMonth()+1).padStart(2,'0');
    const rawYear = dt.getFullYear();
    // if thaiParsed succeeded, rawYear is already a proper Gregorian year (needs +543).
    // if we fell through to native Date parsing, Sheets may have already mangled a Thai-format
    // string (e.g. "8/1/2569...") into a Date cell using 2569 as a literal Gregorian year — in
    // that case rawYear already IS the Buddhist year, and adding 543 again gives nonsense (3112).
    const year = (!thaiParsed && rawYear > 2100) ? rawYear : rawYear + 543;
    return `${day}-${month}-${year}`;
  }catch(e){ return String(d); }
}
function formatMoney(v){
  const n = parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n)) return '';
  return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function unformatMoney(v){
  return String(v==null?'':v).replace(/,/g,'').trim();
}
function computeExpectedNet(base, vat, wht){
  const b = parseFloat(unformatMoney(base))||0, v = parseFloat(unformatMoney(vat))||0, w = parseFloat(unformatMoney(wht))||0;
  // มี WHT -> ยอดจ่ายสุทธิ = Base + VAT - WHT, ไม่มี WHT -> ยอดจ่ายสุทธิ = Base + VAT
  return w > 0 ? (b + v - w) : (b + v);
}
function amountMismatchHTML(base, vat, wht, net){
  const expected = computeExpectedNet(base, vat, wht);
  const actual = parseFloat(unformatMoney(net))||0;
  if(Math.abs(expected - actual) > 0.05){
    return `<div style="font-size:10px;color:var(--stamp-red);font-weight:600;white-space:nowrap;">⚠ ยอดไม่ตรง ควรเป็น ${expected.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>`;
  }
  return '';
}
/* Tax Code: V7 and D7 both = VAT 7% (Base = Net x 100/107, VAT = Net - Base); VX = no VAT */
function isVat7Code_(c){ return c==='V7' || c==='D7'; }
function taxSplit_(taxCode, net){
  if(isVat7Code_(taxCode)){
    const base = Math.round(net*100/107*100)/100;
    return { base, vat: Math.round((net-base)*100)/100 };
  }
  return { base: net, vat: 0 };
}
/* WHT Rate helper: pick 1% / 3% / 5% -> WHT Amt = Base Amt x rate */
const WHT_RATES = [1,3,5];
function netFrom_(base, vat, wht){ return Math.round(((parseFloat(unformatMoney(base))||0)+(parseFloat(unformatMoney(vat))||0)-(parseFloat(unformatMoney(wht))||0))*100)/100; }
function whtFromRate_(base, rate){ return Math.round((parseFloat(base)||0)*rate)/100; }
function whtRateSelectedFor_(base, wht){
  const b = parseFloat(unformatMoney(base))||0, w = parseFloat(unformatMoney(wht))||0;
  if(b<=0 || w<=0) return '';
  const pct = Math.round(w/b*10000)/100;
  return WHT_RATES.includes(pct) ? String(pct) : '';
}
function whtRateOptionsHTML_(base, wht){
  const sel = whtRateSelectedFor_(base, wht);
  return `<option value="">Rate WHT — กรอกเอง</option>` + WHT_RATES.map(r=>`<option value="${r}" ${sel===String(r)?'selected':''}>WHT ${r}%</option>`).join('');
}
function whtPercentHTML(base, wht){
  const b = parseFloat(unformatMoney(base))||0, w = parseFloat(unformatMoney(wht))||0;
  if(b<=0 || w<=0) return '';
  const pct = (w/b*100);
  return `<div style="font-size:10px;color:var(--ink-soft);white-space:nowrap;">≈ หัก ${pct.toFixed(2)}%</div>`;
}

async function amtInputBlur(el, id, field){

async function applyWhtRate(id, rate){
  if(!rate) return;
  const baseEl = document.getElementById('amt-baseAmount-'+id);
  const whtEl = document.getElementById('amt-whtAmount-'+id);
  if(!baseEl || !whtEl) return;
  const wht = whtFromRate_(unformatMoney(baseEl.value), parseFloat(rate));
  whtEl.value = formatMoney(wht);
  // Net (ยอดจ่ายสุทธิ) follows: Base + VAT - WHT
  const vatEl = document.getElementById('amt-vatAmount-'+id), netEl = document.getElementById('amt-netAmount-'+id);
  const net = netFrom_(baseEl.value, vatEl?vatEl.value:0, wht);
  if(netEl) netEl.value = formatMoney(net);
  const doc = state.documents.find(d=>d.id===id);
  const patch = { id, whtAmount: wht.toFixed(2), netAmount: net.toFixed(2), modifiedBy: fullName(state.user), modifiedDate: nowStr() };
  const res = await apiCall('updateDocument', patch);
  if(!res.success){ showToast('บันทึกจำนวนเงินไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  else if(doc){ doc.whtAmount = patch.whtAmount; doc.netAmount = patch.netAmount; }
  updateAmountHints(id);
}
function updateAmountHints(id){
  const get = f => { const el = document.getElementById('amt-'+f+'-'+id); return el ? el.value : ''; };

}

/* Tax Code calculation (accounting): V7 = 7% VAT (Base = Net × 100/107, VAT = Net − Base); VX = no VAT (Base = Net, VAT = 0) */
async function applyTaxCalc(id){
  const taxEl = document.getElementById('taxCode-'+id);
  if(!taxEl) return;
  const taxCode = taxEl.value;
  const netEl = document.getElementById('amt-netAmount-'+id);
  const baseEl = document.getElementById('amt-baseAmount-'+id);
  const vatEl = document.getElementById('amt-vatAmount-'+id);
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  const patch = { id, taxCode };
  if(taxCode && netEl){
    const rs = document.getElementById('whtRate-'+id), whtEl = document.getElementById('amt-whtAmount-'+id);
    const rateOn = !!(rs && rs.value && whtEl);
    // with a WHT rate selected the Net on screen is already "after WHT" — rebuild the gross first so Base/VAT stay right
    const net = (parseFloat(unformatMoney(netEl.value))||0) + (rateOn ? (parseFloat(unformatMoney(whtEl.value))||0) : 0);
    const { base, vat } = taxSplit_(taxCode, net);
    if(baseEl) baseEl.value = formatMoney(base);
    if(vatEl) vatEl.value = formatMoney(vat);
    patch.baseAmount = base.toFixed(2);
    patch.vatAmount = vat.toFixed(2);
    if(rateOn){
      const w = whtFromRate_(base, parseFloat(rs.value)), n2 = netFrom_(base, vat, w);
      whtEl.value = formatMoney(w); netEl.value = formatMoney(n2);
      patch.whtAmount = w.toFixed(2); patch.netAmount = n2.toFixed(2);
    }
  }
  const res = await apiCall('updateDocument', patch);
  if(!res.success){ showToast('บันทึกการคำนวณไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  Object.assign(doc, patch);
  updateAmountHints(id);
}

// tier; if BOTH are configured the document waits at 'รอผู้อนุมัติ2' until every slot below has
// been signed (AND gate) before moving on. Returns [] when neither slot is configured for this
// doc's type+company, meaning the stage simply doesn't apply/exist for this document.
function approver2Slots(doc){
  const mapping = getApprovalMapping(doc.docType, doc.companyCode);
  if(!mapping) return [];
  const slots = [];
  if(mapping.approverId2) slots.push({ slot:2, id:mapping.approverId2, signedBy:doc.approver2By, signedDate:doc.approver2Date });
  if(mapping.approverId3) slots.push({ slot:3, id:mapping.approverId3, signedBy:doc.approver3By, signedDate:doc.approver3Date });
  return slots;
}
function pendingApprover2Slots(doc){ return approver2Slots(doc).filter(s=>!s.signedBy); }
function canActOnStage(doc){
  const role = stageRoleForDoc(doc);
  if(!role) return true;
  if(role==='approver2'){
    const pending = pendingApprover2Slots(doc);
    if(!pending.length) return true; // nothing left pending / nothing configured -> unrestricted fallback
    return isAdmin() || pending.some(s=>s.id===state.user.id);
  }
  const mapping = getApprovalMapping(doc.docType, doc.companyCode);
  if(!mapping) return true; // no mapping configured for this type+company -> unrestricted fallback
  const targetId = role==='reviewer' ? mapping.reviewerId : mapping.approverId;
  if(!targetId) return true; // mapping row exists but this slot left unset -> unrestricted fallback
  return isAdmin() || state.user.id === targetId;
}
function assignedActorName(doc){
  const role = stageRoleForDoc(doc);
  if(!role) return null;
  if(role==='approver2'){
    const slots = approver2Slots(doc);
    if(!slots.length) return null;
    return slots.map(s=>{
      const m = state.members.find(x=>x.id===s.id);
      const name = m ? fullName(m) : '-';
      return s.signedBy ? (name+' ✓') : name;
    }).join(' , ');
  }
  const mapping = getApprovalMapping(doc.docType, doc.companyCode);
  if(!mapping) return null;
  const targetId = role==='reviewer' ? mapping.reviewerId : mapping.approverId;
  if(!targetId) return null;
  const m = state.members.find(x=>x.id===targetId);
  return m ? fullName(m) : null;
}
/* ===================== PAYMENT VOUCHER CLOSE-OUT (Part A) ===================== */
// completely separate mapping/stage machinery from the document-flow one above — operates on
// state.paymentVouchers records, keyed by companyCode only (no docType), per the agreed spec.
function getPaymentMapping(companyCode){
  return state.paymentMappings.find(mp=>String(mp.companyCode)===String(companyCode)) || null;
}
function pvStageRoleForVoucher(v){
  if(v.status==='รอผู้ตรวจสอบPayment' || v.status==='ตีกลับแก้ไข(ผู้อนุมัติPayment)') return 'pvReviewer';
  if(v.status==='รอผู้อนุมัติPayment') return 'pvApprover';
  return null;
}
// reviewerId / approverId on a PaymentMapping row are ';'-separated lists — several people can be Payment
// reviewers/approvers of one company
function pvIds_(s){ return String(s==null?'':s).split(';').map(x=>x.trim()).filter(Boolean); }
// who may act on this voucher at its current stage: the reviewer/approver set on the bank account it was paid
// from (Admin → บัญชีโอน), otherwise everybody listed for the company. [] = nothing configured (unrestricted fallback)
function pvEligibleIds_(v, role){
  const field = role==='pvReviewer' ? 'reviewerId' : 'approverId';
  const acc = v.payAccountNo ? state.paymentAccounts.find(a=>String(a.companyCode)===String(v.companyCode) && String(a.accountNo)===String(v.payAccountNo)) : null;
  const specific = acc && String(acc[field]||'').trim();
  if(specific) return [specific];
  const mapping = getPaymentMapping(v.companyCode);
  return mapping ? pvIds_(mapping[field]) : [];
}
function pvCanActOnStage(v){
  const role = pvStageRoleForVoucher(v);
  if(!role) return true;
  const ids = pvEligibleIds_(v, role);
  if(!ids.length) return true; // nothing configured for this company/account -> unrestricted fallback (any user with the matching role)
  return isAdmin() || ids.includes(state.user.id);
}
function pvAssignedActorName(v){
  const role = pvStageRoleForVoucher(v);
  if(!role) return null;
  const names = pvEligibleIds_(v, role).map(id=>{ const m = state.members.find(x=>x.id===id); return m ? fullName(m) : null; }).filter(Boolean);
  return names.length ? names.join(' , ') : null;
}
function pvDocIds(v){
  try{ return v.docIds ? JSON.parse(v.docIds) : []; }catch(e){ return []; }
}
// how many Payment-close-out items are currently waiting on the logged-in user's action — drives
// the red 🔴 badge count on the "อนุมัติ Payment" top-level tab
function pvPendingCountForUser(){
  if(!state.user) return 0;
  const tabs = allowedPvTabs();
  if(!tabs.length) return 0;
  const statusByTab = {pvReviewer:'รอผู้ตรวจสอบPayment', pvApprover:'รอผู้อนุมัติPayment'};
  let count = 0;
  tabs.forEach(t=>{
    const status = statusByTab[t];
    if(status) count += state.paymentVouchers.filter(v=>v.status===status && pvCanActOnStage(v)).length;
  });
  return count + viaPendingCountForUser();
}
// mirrors pvPendingCountForUser but for the existing accounting-flow tabs, for the matching
// badge on the "อนุมัติบันทึกบัญชี" top-level tab
function accountingPendingCountForUser(){
  if(!state.user) return 0;
  const tabs = allowedApprovalTabs();
  if(!tabs.length) return 0;
  const statusByTab = {accountant:'รอนักบัญชี', reviewer:'รอผู้ตรวจสอบ', approver:'รอผู้อนุมัติ'};
  let count = 0;
  tabs.forEach(t=>{
    const status = statusByTab[t];
    const mine = d => (t==='accountant' || !isViaPaymentDoc_(d)) && canActOnStage(d);
    count += state.documents.filter(d=>d.status===status && mine(d)).length;
    if(t==='approver') count += state.documents.filter(d=>d.status==='รอผู้อนุมัติ2' && mine(d)).length;
  });
  return count;
}
// documents of via-Payment types waiting on this user (shown under อนุมัติ Payment → Payment อื่นๆ)
// pending count for ONE sub-tab under อนุมัติ Payment (badge on the sub-tab)
function pvTabCountForUser_(t){
  if(t==='pvDocs') return viaPendingCountForUser();
  const status = {pvReviewer:'รอผู้ตรวจสอบPayment', pvApprover:'รอผู้อนุมัติPayment'}[t];
  return status ? state.paymentVouchers.filter(v=>v.status===status && pvCanActOnStage(v)).length : 0;
}
function viaPendingCountForUser(){
  if(!state.user) return 0;
  let count = 0;
  viaApprovalTabs_().forEach(t=>{
    const sts = t==='reviewer' ? ['รอผู้ตรวจสอบ'] : ['รอผู้อนุมัติ','รอผู้อนุมัติ2'];

function fmtDateTime(str){
  if(!str) return '-';
  // Thai-format from nowStr(): "D/M/BE, HH:MM:SS" or "D/M/BE HH:MM:SS"
  const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[, ]+(\d{1,2}):(\d{2})/);
  if(m){
    const day = m[1].padStart(2,'0'), month = m[2].padStart(2,'0'), year = m[3];
    const hh = m[4].padStart(2,'0'), mm = m[5];
    return `${day}-${month}-${year} ${hh}:${mm} น.`;
  }
  // fallback — Google Sheets sometimes auto-converts the Thai-format string above into a real
  // Date/DateTime cell, which comes back as an ISO string instead of the D/M/BE text we expect.
  // Parse that directly (still guarding against the double Buddhist-year conversion) so both the
  // date and time keep showing correctly instead of just falling back to date-only.
  try{
    const dt = new Date(str);
    if(!isNaN(dt.getTime())){
      const day = String(dt.getDate()).padStart(2,'0');
      const month = String(dt.getMonth()+1).padStart(2,'0');
      const rawYear = dt.getFullYear();
      const year = rawYear > 2100 ? rawYear : rawYear + 543;
      const hh = String(dt.getHours()).padStart(2,'0');
      const mm = String(dt.getMinutes()).padStart(2,'0');
      return `${day}-${month}-${year} ${hh}:${mm} น.`;
    }
  }catch(e){ /* fall through to date-only below */ }
  return fmtDate(str); // last resort — date only
}

const API_URL = 'https://script.google.com/macros/s/AKfycbzVoY6kSxdJpaHZPf08BWSUvJG6zmysnA2Rn9S5jKslPJxuobJSdFzE4SWRbCbdqWL3/exec';

async function apiCall(action, payload){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({ action, payload: Object.assign({}, payload||{}, (typeof state!=='undefined' && state.user) ? {_actor: state.user.id} : {}) }),
    });
    const data = await res.json();
    if(!data.success && data.error) console.warn('API', action, 'returned error:', data.error);
    if(data && data.error==='company_forbidden'){ showToast('คุณไม่มีสิทธิ์ทำรายการในบริษัทนี้'); }
    return data;
  }catch(err){
    console.error('API call failed', action, err);
    showToast('เชื่อมต่อ Server ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    return { success:false, error:String(err) };
  }
}
async function refreshData(){
  const data = await apiCall('bootstrap', {});
  if(data && data.success){
    // Google Sheets auto-types numeric-looking company codes (1010, 1160, 4040...) as Numbers.
    // <select> option values are always strings, so without this normalization every strict
    // === comparison against a company code silently fails and dropdowns snap back to "all".
    state.members = (data.members || []).map(m=>{
      if(m.signatureImage===undefined) m.signatureImage='';
      m.companyCodes = (m.companyCodes||[]).map(c=>String(c));
      m.canTrack = (m.canTrack===true || m.canTrack==='TRUE' || m.canTrack==='true');
      return m;
    });
    state.companies = (data.companies || []).map(c=>({ ...c, code:String(c.code), trackingEnabled: !(c.trackingEnabled===false || String(c.trackingEnabled).toUpperCase()==='FALSE') }));
    state.docTypes = (data.docTypes || []).map(t=>({ ...t, autoComplete: (t.autoComplete===true||t.autoComplete==='TRUE'||t.autoComplete==='true'), viaPayment: (t.viaPayment===true||t.viaPayment==='TRUE'||t.viaPayment==='true'), receivable: (t.receivable===true||t.receivable==='TRUE'||t.receivable==='true') }));
    state.approvalMappings = (data.approvalMappings || []).map(mp=>({ ...mp, companyCode:String(mp.companyCode) }));
    state.appSettings = data.appSettings || {};
    state.vendors = (data.vendors || []).map(v=>({ ...v, companyCode: String(v.companyCode==null?'':v.companyCode).trim(), vendorCode: String(v.vendorCode) }));
    state.paymentAccounts = (data.paymentAccounts || []).map(a=>({ ...a, companyCode:String(a.companyCode), accountNo:String(a.accountNo), reviewerId:String(a.reviewerId||''), approverId:String(a.approverId||'') }));
    state.paymentMappings = (data.paymentMappings || []).map(mp=>({ ...mp, companyCode:String(mp.companyCode) }));
    state.paymentVouchers = (data.paymentVouchers || []).map(v=>({ ...v, companyCode:String(v.companyCode) }));
    state.documents = (data.documents || []).map(d=>{
      if(d.docSAP===undefined) d.docSAP='';
      if(d.vatAmount===undefined) d.vatAmount='';
      if(d.whtAmount===undefined) d.whtAmount='';
      if(d.baseAmount===undefined) d.baseAmount='';

      if(d.docPayment===undefined) d.docPayment='';

      if(isReceivableType_(d.docType)){ d.skipApprover='TRUE'; d.skipFinance='TRUE'; } // AR types: reviewer signs as approver too, then wait for money (รอรับเงิน)
      if(isViaPaymentType_(d.docType)) d.skipFinance='TRUE'; // via-Payment types always Complete after approval, never go to finance
      if(d.payType===undefined || d.payType===null) d.payType=''; else d.payType=String(d.payType);
      if(d.cancelledBy===undefined) d.cancelledBy='';
      if(d.cancelledDate===undefined) d.cancelledDate='';
      if(d.cancelNote===undefined) d.cancelNote='';
      if(d.docPaymentLink===undefined) d.docPaymentLink='';
      if(d.vendor===undefined) d.vendor='';
      if(d.vendorName===undefined) d.vendorName='';
      if(d.taxCode===undefined) d.taxCode='';
      if(d.sapLines===undefined) d.sapLines='';
      if(d.webDocNo===undefined) d.webDocNo='';
      if(d.manualBankAccount===undefined) d.manualBankAccount='';
      if(d.manualBankName===undefined) d.manualBankName='';
      if(d.historyLog===undefined) d.historyLog='';
      if(d.trackClerkBy===undefined) d.trackClerkBy='';
      if(d.trackClerkDate===undefined) d.trackClerkDate='';
      if(d.trackAcct1By===undefined) d.trackAcct1By='';
      if(d.trackAcct1Date===undefined) d.trackAcct1Date='';
      if(d.trackAcct2By===undefined) d.trackAcct2By='';
      if(d.trackAcct2Date===undefined) d.trackAcct2Date='';

      if(d.trackAcct1Note===undefined) d.trackAcct1Note='';
      if(d.trackAcct2Note===undefined) d.trackAcct2Note='';
      if(d.companyCode!==undefined) d.companyCode=String(d.companyCode);
      return d;

  }

function sapLineAmtInput(docId, idx, field, value){
  const display = (value===''||value===undefined||value===null) ? '' : formatMoney(value);
  return `<input type="text" inputmode="decimal" id="sapline-${field}-${docId}-${idx}" class="sap-input" style="width:95px;text-align:right;" value="${display}" placeholder="0.00" onfocus="this.value=unformatMoney(this.value)" onblur="sapLineAmtLocalUpdate(this,'${docId}',${idx},'${field}')">`;

function applySapLineWhtRate(docId, idx, rate){
  if(!rate) return;
  const baseEl = document.getElementById('sapline-base-'+docId+'-'+idx);
  const whtEl = document.getElementById('sapline-wht-'+docId+'-'+idx);
  if(!baseEl || !whtEl) return;
  const w = whtFromRate_(unformatMoney(baseEl.value), parseFloat(rate));
  whtEl.value = formatMoney(w);
  const vEl = document.getElementById('sapline-vat-'+docId+'-'+idx), nEl = document.getElementById('sapline-net-'+docId+'-'+idx);
  if(nEl) nEl.value = formatMoney(netFrom_(baseEl.value, vEl?vEl.value:0, w));
  recomputeSapLineTotalsLive(docId);
  updateSapLineHints(docId, idx);
  markSapLinesUnsaved(docId);
}
function sapLineAmtLocalUpdate(el, docId, idx, field){
  // local-only: just reformat the display and recompute the aggregate totals shown up top —
  // nothing is sent to the server here, so typing across several fields never flickers/re-renders
  const raw = unformatMoney(el.value);
  el.value = raw==='' ? '' : formatMoney(raw);
  if(field==='base'){ // a WHT rate is selected -> keep WHT Amt = Base x rate
    const rs = document.getElementById('sapline-whtrate-'+docId+'-'+idx), wEl = document.getElementById('sapline-wht-'+docId+'-'+idx);
    if(rs && rs.value && wEl){
      const w = whtFromRate_(raw, parseFloat(rs.value));
      wEl.value = formatMoney(w);
      const vEl = document.getElementById('sapline-vat-'+docId+'-'+idx), nEl = document.getElementById('sapline-net-'+docId+'-'+idx);
      if(nEl) nEl.value = formatMoney(netFrom_(raw, vEl?vEl.value:0, w));
    }
  }
  recomputeSapLineTotalsLive(docId);
  updateSapLineHints(docId, idx);
  markSapLinesUnsaved(docId);
}
function updateSapLineHints(docId, idx){
  const get = f => { const el = document.getElementById('sapline-'+f+'-'+docId+'-'+idx); return el ? el.value : ''; };
  const base = get('base'), vat = get('vat'), wht = get('wht'), net = get('net');
  const whtHint = document.getElementById('sapline-wht-hint-'+docId+'-'+idx);

function recomputeSapLineTotalsLive(docId){

function gatherCurrentSapLinesFromDOM(docId){
  // reads whatever is currently displayed on screen for every line (including any edits still
  // pending save) rather than trusting the last-saved doc.sapLines — so no in-progress edit is
  // ever silently lost by another save action (add/remove/detail-edit) firing first
  const doc = state.documents.find(d=>d.id===docId);
  if(!doc) return [];
  const lines = parseSapLines(doc);
  return lines.map((l,i)=>{
    const vEl = document.getElementById('sapline-vat-'+docId+'-'+i);
    const wEl = document.getElementById('sapline-wht-'+docId+'-'+i);

    const fiDocEl = document.getElementById('sapline-fidoc-'+docId+'-'+i);
    const webDocNoEl = document.getElementById('sapline-webdocno-'+docId+'-'+i);
    const vendorEl = document.getElementById('sapline-vendor-'+docId+'-'+i);
    const vendorNameEl = document.getElementById('sapline-vendorname-'+docId+'-'+i);
    return Object.assign({}, l, {
      vat: vEl ? (parseFloat(unformatMoney(vEl.value))||0) : (parseFloat(l.vat)||0),
      wht: wEl ? (parseFloat(unformatMoney(wEl.value))||0) : (parseFloat(l.wht)||0),

      fiDoc: fiDocEl ? fiDocEl.value.trim() : (l.fiDoc||''),
      webDocNo: webDocNoEl ? webDocNoEl.value.trim() : (l.webDocNo||''),

async function saveSapLinesToDoc(docId, lines){
  const doc = state.documents.find(d=>d.id===docId);
  if(!doc) return;
  const patch = { id: docId, modifiedBy: fullName(state.user), modifiedDate: nowStr() };
  if(lines.length >= 2){
    // genuine split — keep the breakdown, aggregate totals feed the main fields
    lines.forEach((l,i)=>{ l.subId = docId+'-'+(i+1); });
    const sums = lines.reduce((t,l)=>({vat:t.vat+(parseFloat(l.vat)||0), wht:t.wht+(parseFloat(l.wht)||0), base:t.base+(parseFloat(l.base)||0), net:t.net+(parseFloat(l.net)||0)}), {vat:0,wht:0,base:0,net:0});
    patch.sapLines = JSON.stringify(lines);
    patch.vatAmount = sums.vat.toFixed(2);
    patch.whtAmount = sums.wht.toFixed(2);
    patch.baseAmount = sums.base.toFixed(2);
    patch.netAmount = sums.net.toFixed(2);
  } else if(lines.length === 1){
    // back down to a single line — collapse into the simple main fields, no separate breakdown needed
    const l = lines[0];
    patch.sapLines = '';
    patch.docSAP = l.fiDoc || doc.docSAP || '';
    patch.webDocNo = l.webDocNo || doc.webDocNo || '';
    patch.vendor = l.vendor || doc.vendor || '';
    patch.vendorName = l.vendorName || doc.vendorName || '';
    patch.vatAmount = (parseFloat(l.vat)||0).toFixed(2);
    patch.whtAmount = (parseFloat(l.wht)||0).toFixed(2);
    patch.baseAmount = (parseFloat(l.base)||0).toFixed(2);
    patch.netAmount = (parseFloat(l.net)||0).toFixed(2);
  } else {
    patch.sapLines = '';
  }
  showBusyOverlay('กำลังบันทึกรายการ SAP กรุณารอสักครู่...');
  const res = await apiCall('updateDocument', patch);
  hideBusyOverlay();
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  Object.assign(doc, patch);
  showToast('บันทึกรายการ SAP เรียบร้อย');
  render();
}
async function addSapLineInline(docId){
  const doc = state.documents.find(d=>d.id===docId);
  if(!doc) return;
  let lines = parseSapLines(doc);
  if(lines.length === 0){
    // first split ever for this document — seed line 1 from whatever is already in the main
    // fields (prefer live unsaved input values if present) so no data is lost, then add a
    // blank line 2 for the accountant to fill in
    const readAmt = (elId, fallback) => {
      const el = document.getElementById(elId);
      const v = el ? unformatMoney(el.value) : '';
      return v!=='' ? (parseFloat(v)||0) : (parseFloat(fallback)||0);
    };
    const webDocNoEl = document.getElementById('webDocNo-'+docId);
    const line1 = {
      subId: docId+'-1',
      fiDoc: doc.docSAP || '',
      webDocNo: (webDocNoEl ? webDocNoEl.value.trim() : '') || doc.webDocNo || '',
      vendor: doc.vendor || '',
      vendorName: doc.vendorName || '',
      vat: readAmt('amt-vatAmount-'+docId, doc.vatAmount),
      wht: readAmt('amt-whtAmount-'+docId, doc.whtAmount),
      base: readAmt('amt-baseAmount-'+docId, doc.baseAmount),
      net: readAmt('amt-netAmount-'+docId, doc.netAmount),
      taxCode: doc.taxCode || '',
    };
    const line2 = { subId: docId+'-2', fiDoc:'', webDocNo:'', vendor:'', vendorName:'', vat:0, wht:0, base:0, net:0, taxCode:'' };
    lines = [line1, line2];
  } else {
    lines = gatherCurrentSapLinesFromDOM(docId); // preserve any pending unsaved edits before adding
    lines.push({ subId:'', fiDoc:'', webDocNo:'', vendor:'', vendorName:'', vat:0, wht:0, base:0, net:0, taxCode:'' });
  }
  await saveSapLinesToDoc(docId, lines);
}

function applySapLineTaxCalcLocal(docId, idx, taxCode){
  // local-only, mirrors sapLineAmtLocalUpdate — computes Base/VAT from Net right in the
  // browser and only marks the row unsaved; the actual save happens via the Save button

  const rs = document.getElementById('sapline-whtrate-'+docId+'-'+idx), wEl = document.getElementById('sapline-wht-'+docId+'-'+idx);

  const net = (netEl ? parseFloat(unformatMoney(netEl.value))||0 : 0) + (rateOn ? (parseFloat(unformatMoney(wEl.value))||0) : 0);

  const vatEl = document.getElementById('sapline-vat-'+docId+'-'+idx);

  markSapLinesUnsaved(docId);
}

function uploadSapDataForDoc(e, id){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  const statusEl = document.getElementById('sap-import-status-'+id);
  if(statusEl) statusEl.textContent = 'กำลังอ่านไฟล์...';
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      if(typeof XLSX === 'undefined'){ if(statusEl) statusEl.textContent='โหลดไลบรารีอ่านไฟล์ไม่สำเร็จ ลองรีเฟรชหน้าเว็บ'; return; }
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      // find the real header row — the file has a title + blank rows before it
      const headerIdx = aoa.findIndex(row => row.some(c => String(c).trim().toLowerCase()==='web doc number'));
      if(headerIdx===-1){ if(statusEl) statusEl.textContent='ไม่พบคอลัมน์ "Web Doc Number" ในไฟล์ กรุณาตรวจสอบไฟล์อีกครั้ง'; return; }
      const header = aoa[headerIdx].map(h=>String(h).trim().toLowerCase());
      const colIdx = name => header.findIndex(h=>h===name);
      const iWebDoc = colIdx('web doc number');
      const iFiDoc = colIdx('fi doc number');
      const iVendor = colIdx('vendor number');
      const iRequester = colIdx('requester name');
      const iVat = colIdx('vat amount');
      const iWht = colIdx('wht amount');
      const iAmount = colIdx('amount');
      const iNet = colIdx('net amount');

      // no longer filtered by Web Doc Number match — show every row in the file, let the
      // accountant tick which ones actually belong to this document
      const dataRows = aoa.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
      if(!dataRows.length){
        if(statusEl) statusEl.textContent = 'ไม่พบข้อมูลในไฟล์';
        e.target.value = '';
        return;
      }
      const newLines = dataRows.map(r=>({
        webDoc: iWebDoc!==-1 ? String(r[iWebDoc]||'').trim() : '',
        fiDoc: iFiDoc!==-1 ? String(r[iFiDoc]||'').trim() : '',
        vendor: iVendor!==-1 ? String(r[iVendor]||'').trim() : '',
        vendorName: iRequester!==-1 ? String(r[iRequester]||'').trim() : '',
        vat: iVat!==-1 ? (parseFloat(r[iVat])||0) : 0,
        wht: iWht!==-1 ? (parseFloat(r[iWht])||0) : 0,
        base: iAmount!==-1 ? (parseFloat(String(r[iAmount]).replace(/,/g,''))||0) : 0,
        net: iNet!==-1 ? (parseFloat(String(r[iNet]).replace(/,/g,''))||0) : 0,
        checked: false,
      }));
      e.target.value = '';
      // seed with whatever was already saved for this document (ticked, removable) plus the newly-parsed rows
      showSapImportPreview(id, existingSapLinesAsStaging(doc).concat(newLines));
    }catch(err){
      if(statusEl) statusEl.textContent = 'อ่านไฟล์ไม่สำเร็จ: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmSapImport(){
  const pending = state.pendingSapImport;
  if(!pending) return;
  const { id, lines } = pending;
  const selected = lines.filter(l=>l.checked);
  if(!selected.length){ showToast('กรุณาติ๊กเลือกอย่างน้อย 1 รายการ'); return; }
  const doc = state.documents.find(d=>d.id===id);
  if(!doc) return;
  const statusEl = document.getElementById('sap-import-status-'+id);
  const finalLines = selected.map((l,i)=>({ subId: id+'-'+(i+1), fiDoc:l.fiDoc, vendor:l.vendor, vendorName:l.vendorName, vat:l.vat, wht:l.wht, base:l.base, net:l.net }));
  const sums = finalLines.reduce((t,l)=>({vat:t.vat+l.vat, wht:t.wht+l.wht, base:t.base+l.base, net:t.net+l.net}), {vat:0,wht:0,base:0,net:0});
  const patch = {
    id, sapLines: JSON.stringify(finalLines),
    vatAmount: sums.vat.toFixed(2), whtAmount: sums.wht.toFixed(2), baseAmount: sums.base.toFixed(2), netAmount: sums.net.toFixed(2),
    modifiedBy: fullName(state.user), modifiedDate: nowStr(),
  };
  hideBusyOverlay();
  showBusyOverlay('กำลังนำเข้าข้อมูล SAP กรุณารอสักครู่...');
  const res = await apiCall('updateDocument', patch);
  hideBusyOverlay();
  state.pendingSapImport = null;
  if(!res.success){ if(statusEl) statusEl.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'; return; }
  Object.assign(doc, patch);
  if(statusEl) statusEl.textContent = `นำเข้าสำเร็จ ${selected.length} FI Doc`;
  showToast('นำเข้าข้อมูล SAP สำหรับ '+displayId(id)+' เรียบร้อย ('+selected.length+' FI Doc)');
  render();
}


/* ============================= RENDER: ROOT (focus-preserving) ============================= */
function render(){
  const root = document.getElementById('app');
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;

  if(state.loading){ root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8792A8;background:var(--navy);font-family:IBM Plex Mono,monospace;font-size:13px;">กำลังโหลดระบบ...</div>'; return; }
  if(!state.user){ root.innerHTML = loginHTML(); return; }
  initCalculatorWidget();
  root.innerHTML = layoutHTML();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---- Session persistence (stores only the member id + login time, never the password) ----
   Every successful login now keeps a session in this browser, even without ticking
   "จดจำการเข้าสู่ระบบ" — so opening a notification-email link while the tab/browser is still
   around doesn't force a fresh login every time. Ticking the checkbox keeps it forever (classic
   remember-me); leaving it unticked keeps it only for SESSION_MAX_HOURS from login time, after
   which the next page load asks to log in again. */
const SESSION_KEY = 'dfSession';
const SESSION_MAX_HOURS = 5; // un-"remembered" session auto-expires this many hours after login
function saveSession(user, remember){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ id:user.id, ts:Date.now(), remember: !!remember })); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ saved = null; }
  if(!saved || !saved.id) return;
  if(!saved.remember){
    const ageHours = (Date.now() - (saved.ts || 0)) / 3600000;
    if(ageHours > SESSION_MAX_HOURS){ clearSession(); return; }
  }
  const member = state.members.find(m=>m.id===saved.id);
  if(!member){ clearSession(); return; }
  state.user = member;
  state.view = 'dashboard';
  state.approvalTab = defaultApprovalTab();
}

async function doLogin(e){
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังเข้าสู่ระบบ...'; }
  const f = new FormData(e.target);
  const email = f.get('email').trim().toLowerCase();
  const password = f.get('password').trim();
  const remember = f.get('remember') === 'on';
  const res = await apiCall('login', { email, password });
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'เข้าสู่ระบบ'; }
  if(!res.success){
    if(res.error === 'not_found'){ showToast('ไม่พบบัญชีนี้ในระบบ กรุณาติดต่อ Admin'); return; }
    if(res.error === 'no_password'){ showToast('บัญชีนี้ยังไม่ได้ตั้งรหัสผ่าน กรุณาตั้งรหัสผ่านก่อน'); state.authEmail = email; state.authView='set-password'; render(); return; }
    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง'); return;
  }
  state.user = res.user;
  state.view = 'dashboard';
  state.approvalTab = defaultApprovalTab();
  await refreshData();
  // keep the freshly-logged-in user object (refreshData rebuilds state.members, so re-point state.user at the matching record)
  const refreshedUser = state.members.find(m=>m.id===res.user.id);
  if(refreshedUser) state.user = refreshedUser;
  saveSession(state.user, remember);
  // if this login was triggered by opening a notification email link, jump straight there
  const linkedDocId = getLinkedDocIdFromUrl_();
  if(linkedDocId){ render(); openDocFromLink(linkedDocId); return; }
  const linkedPvId = getLinkedPvIdFromUrl_();
  if(linkedPvId){ render(); openPvFromLink(linkedPvId); return; }
  render();
}
async function doSetPassword(e){
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  const f = new FormData(e.target);
  const email = f.get('email').trim().toLowerCase();
  const pw = f.get('password').trim();
  const confirm = f.get('confirm').trim();
  if(pw.length < 6){ showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
  if(pw !== confirm){ showToast('รหัสผ่านที่กรอกไม่ตรงกัน'); return; }
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังบันทึก...'; }
  const res = await apiCall('setPassword', { email, password: pw });
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'บันทึกรหัสผ่าน'; }
  if(!res.success){
    if(res.error === 'not_found'){ showToast('ไม่พบอีเมลนี้ในระบบ กรุณาให้ Admin เพิ่ม Member ก่อน'); return; }
    showToast('ตั้งรหัสผ่านไม่สำเร็จ ลองใหม่อีกครั้ง'); return;
  }
  showToast('ตั้งรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบ');
  state.authView = 'login'; state.authEmail = '';
  render();
}

/* ============================= FLOATING CALCULATOR WIDGET ============================= */
/* Deliberately kept OUTSIDE the main state/render() cycle — attached directly to
   document.body so it is never touched by root.innerHTML = layoutHTML(), meaning its
   position, size, and current calculation survive every re-render of the app underneath it. */
let calcState = { display:'0', prevValue:null, operator:null, waitingForOperand:false };

function initCalculatorWidget(){
  if(document.getElementById('calc-fab')) return; // already created — no-op on every later render()

  const fab = document.createElement('button');
  fab.id = 'calc-fab';
  fab.className = 'calc-fab';
  fab.innerHTML = '🧮';
  fab.title = 'เครื่องคิดเลข';
  fab.onclick = toggleCalcWindow;
  document.body.appendChild(fab);

  const win = document.createElement('div');
  win.id = 'calc-window';
  win.className = 'calc-window';
  win.style.top = '90px';
  win.style.right = '84px';
  win.innerHTML = `
    <div class="calc-header" id="calc-drag-handle">
      <span>🧮 เครื่องคิดเลข</span>
      <button onclick="toggleCalcWindow()" title="ปิด">✕</button>
    </div>
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn calc-clear" onclick="calcClear()">C</button>
      <button class="calc-btn calc-op" onclick="calcBackspace()">⌫</button>
      <button class="calc-btn calc-op" onclick="calcOperator('%')">%</button>
      <button class="calc-btn calc-op" onclick="calcOperator('÷')">÷</button>

      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn calc-op" onclick="calcOperator('×')">×</button>

      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn calc-op" onclick="calcOperator('-')">−</button>

      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn calc-op" onclick="calcOperator('+')">+</button>

      <button class="calc-btn" onclick="calcInput('0')" style="grid-column:span 2;">0</button>
      <button class="calc-btn" onclick="calcInput('.')">.</button>
      <button class="calc-btn calc-eq" onclick="calcEquals()">=</button>
    </div>`;
  document.body.appendChild(win);
  makeCalcDraggable(win, document.getElementById('calc-drag-handle'));
}
function toggleCalcWindow(){
  const win = document.getElementById('calc-window');
  if(!win) return;
  win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
}
function makeCalcDraggable(win, handle){
  let dragging = false, offsetX = 0, offsetY = 0;
  const start = (clientX, clientY) => {
    dragging = true;
    const rect = win.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    win.style.right = 'auto'; // switch from right-anchored to free left/top positioning once dragged
  };
  const move = (clientX, clientY) => {
    if(!dragging) return;
    const maxX = window.innerWidth - 60, maxY = window.innerHeight - 40;
    const x = Math.max(0, Math.min(maxX, clientX - offsetX));
    const y = Math.max(0, Math.min(maxY, clientY - offsetY));
    win.style.left = x + 'px';
    win.style.top = y + 'px';
  };
  const end = () => { dragging = false; };
  handle.addEventListener('mousedown', e => { start(e.clientX, e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  document.addEventListener('mouseup', end);
  handle.addEventListener('touchstart', e => { const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  document.addEventListener('touchmove', e => { const t=e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
  document.addEventListener('touchend', end);
}
function calcRenderDisplay(){
  const el = document.getElementById('calc-display');
  if(el) el.textContent = calcState.display;
}
function calcInput(digit){
  if(calcState.waitingForOperand){
    calcState.display = digit === '.' ? '0.' : digit;
    calcState.waitingForOperand = false;
  } else {
    if(digit === '.' && calcState.display.includes('.')) return;
    calcState.display = (calcState.display === '0' && digit !== '.') ? digit : calcState.display + digit;
  }
  calcRenderDisplay();
}
function calcBackspace(){
  calcState.display = calcState.display.length > 1 ? calcState.display.slice(0,-1) : '0';
  calcRenderDisplay();
}
function calcClear(){
  calcState = { display:'0', prevValue:null, operator:null, waitingForOperand:false };
  calcRenderDisplay();
}
function calcCompute(a, b, op){
  switch(op){
    case '+': return a + b;
    case '-': return a - b;
    case '×': return a * b;
    case '÷': return b === 0 ? 0 : a / b;
    case '%': return a % b;
    default: return b;
  }
}
function calcOperator(op){
  const inputValue = parseFloat(calcState.display);
  if(op === '%'){
    let result;
    if(calcState.prevValue != null && calcState.operator){
      const pct = (calcState.prevValue * inputValue) / 100;
      if(calcState.operator === '+') result = calcState.prevValue + pct;
      else if(calcState.operator === '-') result = calcState.prevValue - pct;
      else if(calcState.operator === '×') result = pct;             // e.g. 1000 × 7% = 70
      else if(calcState.operator === '÷') result = inputValue===0 ? 0 : calcState.prevValue / (inputValue/100);
      else result = pct;
    } else {
      result = inputValue / 100; // standalone %, no pending operator — e.g. 50% -> 0.5
    }
    calcState.display = String(Math.round(result*10000)/10000);
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = true;
    calcRenderDisplay();
    return;
  }
  if(calcState.operator && calcState.waitingForOperand){ calcState.operator = op; return; }
  if(calcState.prevValue == null){
    calcState.prevValue = inputValue;
  } else if(calcState.operator){
    calcState.prevValue = calcCompute(calcState.prevValue, inputValue, calcState.operator);
    calcState.display = String(Math.round(calcState.prevValue*10000)/10000);
  }
  calcState.waitingForOperand = true;
  calcState.operator = op;
  calcRenderDisplay();
}
function calcEquals(){
  const inputValue = parseFloat(calcState.display);
  if(calcState.operator!=null && calcState.prevValue!=null){
    const result = calcCompute(calcState.prevValue, inputValue, calcState.operator);
    calcState.display = String(Math.round(result*10000)/10000);
    calcState.prevValue = null;
    calcState.operator = null;
    calcState.waitingForOperand = true;
    calcRenderDisplay();
  }
}

function canSeeApproval(){ return ['นักบัญชี','ผู้ตรวจสอบ','ผู้อนุมัติ','หัวหน้าแผนกการเงิน','ผู้อนุมัติการเงิน','Admin'].includes(state.user.role) || hasPvDuty(); }
// Payment-reviewer/approver duty is granted TWO ways, independently of a member's single
// primary role field: (1) a dedicated role 'หัวหน้าแผนกการเงิน'/'ผู้อนุมัติการเงิน' for someone
// whose whole job is Payment close-out, or (2) being named reviewerId/approverId in ANY row of
// Payment Mapping, which is set per company on the "กำหนดสิทธิ์การใช้งาน" screen itself (ticking
// "ตรวจสอบ Payment"/"อนุมัติ Payment" on that company's row). This is what lets one person (e.g.
// Anake) be accounting-reviewer only for one company and both accounting-reviewer AND Payment
// reviewer/approver for another, since the per-company split is driven entirely by Payment
// Mapping data, never by the single role field.
function hasPvDuty(){
  return state.paymentMappings.some(mp=>pvIds_(mp.reviewerId).includes(state.user.id) || pvIds_(mp.approverId).includes(state.user.id));
}
// หัวหน้าแผนกการเงิน/ผู้อนุมัติการเงิน (the Payment Voucher close-out reviewer/approver) get the
// same Payment Voucher / Report Payment access เจ้าหน้าที่การเงิน has, per the agreed spec
// the Payment Voucher (ยืนยันรวบจ่าย) menu is for finance only — reviewers/approvers with Payment duty use อนุมัติ Payment instead
function canSeePaymentVoucherMenu(){ return ['เจ้าหน้าที่การเงิน','หัวหน้าแผนกการเงิน','ผู้อนุมัติการเงิน','Admin'].includes(state.user.role); }
function canSeePayment(){ return ['เจ้าหน้าที่การเงิน','หัวหน้าแผนกการเงิน','ผู้อนุมัติการเงิน','Admin'].includes(state.user.role) || hasPvDuty(); }
function canSeeVoucherReport(){ return ['นักบัญชี','ผู้ตรวจสอบ','Admin'].includes(state.user.role); }
function isAdmin(){ return state.user.role === 'Admin'; }
function defaultApprovalTab(){
  const map = {'นักบัญชี':'accountant','ผู้ตรวจสอบ':'reviewer','ผู้อนุมัติ':'approver'};
  return map[state.user.role] || 'accountant';
}
function allowedApprovalTabs(){
  if(isAdmin()) return ['accountant','reviewer','approver'];
  const map = {'นักบัญชี':['accountant'],'ผู้ตรวจสอบ':['reviewer'],'ผู้อนุมัติ':['approver']};
  return map[state.user.role] || [];
}
// top-level split on the "การอนุมัติเอกสาร" page: 'accounting' = the existing document flow
// (นักบัญชี/ผู้ตรวจสอบ/ผู้อนุมัติ[1/2/3]); 'payment' = the new Payment Voucher close-out flow
// (ผู้ตรวจสอบ Payment / ผู้อนุมัติ Payment). A user only sees the groups their role covers —
// someone who is only หัวหน้าแผนกการเงิน never sees "อนุมัติบันทึกบัญชี" at all, and vice versa.
function allowedApprovalGroups(){
  const groups = [];
  if(isAdmin() || allowedApprovalTabs().length) groups.push('accounting');
  if(isAdmin() || allowedPvTabs().length) groups.push('payment');
  return groups;
}
function defaultApprovalGroup(){
  const groups = allowedApprovalGroups();
  if(groups.includes('accounting') && allowedApprovalTabs().length) return 'accounting';
  if(groups.includes('payment')) return 'payment';
  return groups[0] || 'accounting';
}
function allowedPvTabs(){
  const withVia = arr => (viaApprovalTabs_().length ? arr.concat(['pvDocs']) : arr);
  if(isAdmin()) return withVia(['pvReviewer','pvApprover']);
  const tabs = [];
  const isReviewerAnywhere = state.user.role==='หัวหน้าแผนกการเงิน' || state.paymentMappings.some(mp=>pvIds_(mp.reviewerId).includes(state.user.id));
  const isApproverAnywhere = state.user.role==='ผู้อนุมัติการเงิน' || state.paymentMappings.some(mp=>pvIds_(mp.approverId).includes(state.user.id));
  if(isReviewerAnywhere) tabs.push('pvReviewer');
  if(isApproverAnywhere) tabs.push('pvApprover');
  return withVia(tabs);
}
function defaultPvTab(){
  const tabs = allowedPvTabs();
  return tabs[0] || (isAdmin() ? 'pvReviewer' : '');
}

/* ---- Deep-linking straight to one document (e.g. from an email notification link) ---- */
// which approval-group tab a document's current status belongs under, so a notification
// email link can land the reader exactly where they'd act on it
function statusToApprovalTab_(status){
  const map = {
    'รอนักบัญชี':'accountant',
    'ตีกลับแก้ไข(ผู้ตรวจสอบ)':'accountant',
    'รอผู้ตรวจสอบ':'reviewer',
    'ตีกลับแก้ไข(ผู้อนุมัติ)':'reviewer',
    'รอผู้อนุมัติ':'approver',
    'รอผู้อนุมัติ2':'approver',
    'ตีกลับแก้ไข(ผู้อนุมัติ2)':'approver',
  };
  return map[status] || null;
}
// reads ?docId=... from the current URL (used by email notification links)
function getLinkedDocIdFromUrl_(){
  try{
    const params = new URLSearchParams(window.location.search);
    return params.get('docId') || null;
  }catch(e){ return null; }
}
// navigates straight to the approval row for one document — called once the member is
// logged in and data has loaded, either right after loadAll() (remembered session) or right
// after doLogin() (fresh login triggered by opening the link while logged out)
function openDocFromLink(docId){
  const doc = state.documents.find(d=>String(d.id)===String(docId));
  if(!doc){ showToast('ไม่พบเอกสาร ID ' + docId + ' หรือคุณไม่มีสิทธิ์เข้าถึงเอกสารนี้'); return; }
  const tab = statusToApprovalTab_(doc.status);
  const canOpenTab = tab && (isAdmin() || allowedApprovalTabs().includes(tab));
  if(canOpenTab){
    state.view = 'approval';
    state.approvalGroup = (tab!=='accountant' && isViaPaymentDoc_(doc)) ? 'payment' : 'accounting';
    if(state.approvalGroup==='payment') state.pvTab = 'pvDocs';
    state.approvalTab = tab;
    state.approvalCompany = 'all';
    state.approvalSearch = { type:'', name:'', due:'', createdBy:'' };
    state.expandedRow = doc.id;
    showToast('เปิดเอกสาร ID ' + displayId(doc.id));
  } else {
    showToast('เอกสาร ID ' + displayId(doc.id) + ' อยู่ในสถานะ "' + (doc.status||'-') + '" — คุณไม่มีสิทธิ์ดำเนินการในขั้นนี้');
  }
  render();
  setTimeout(()=>{
    const el = document.getElementById('doclink-' + doc.id);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 60);
}

/* ============================= STAMP TRAIL ============================= */
function trailHTML(doc){
  if(doc.status === 'Complete'){
    // a small extra badge showing whether this Complete document's payment batch has gone
    // through the separate Payment Voucher close-out flow yet (Part A) — only shown for
    // documents that actually went through a payment batch (docPayment set) and that have a
    // matching close-out record; a Complete document with no payment batch at all (e.g. the
    // skipFinance shortcut) or legacy data from before this feature shows no extra badge.
    let pvBadge = '';
    if(doc.docPayment){
      const pv = state.paymentVouchers.find(v=>String(v.docPayment)===String(doc.docPayment) && String(v.companyCode)===String(doc.companyCode));
      if(pv){
        pvBadge = pv.locked==='TRUE'
          ? ` <span class="status-pill" style="background:#E6F4EA;color:#1E7D32;font-size:10px;" title="ปิดรอบ Payment สมบูรณ์แล้ว">✓ ปิดรอบ Payment</span>`
          : ` <span class="status-pill" style="background:#FFF3E0;color:#B36B00;font-size:10px;" title="สถานะ: ${pv.status}">⏳ รอปิดรอบ Payment</span>`;
      }
    }
    return `<span class="status-pill complete">✓ Complete</span>${pvBadge}`;
  }
  if(doc.status === 'ยกเลิก'){
    return `<span class="status-pill cancel">✕ ยกเลิก</span>`;
  }
  if(doc.status.startsWith('ตีกลับ')){
    return `<span class="status-pill reject">↺ ${doc.status}</span>`;
  }
  // trail follows the chain mapped for THIS document's type + company:
  // นักบัญชี → ผู้ตรวจสอบ → ผู้อนุมัติ → [ผู้อนุมัติ 2/3 — only when mapped] → การเงิน
  const skipAppr = doc.skipApprover==='TRUE' || doc.skipApprover===true;
  const has2 = approver2Slots(doc).length > 0;
  const chain = [
    {status:'รอนักบัญชี', label:'นักบัญชี'},
    {status:'รอผู้ตรวจสอบ', label:'ผู้ตรวจสอบ'},
  ];
  if(!skipAppr){
    chain.push({status:'รอผู้อนุมัติ', label:'ผู้อนุมัติ'});
    if(has2 || doc.status==='รอผู้อนุมัติ2') chain.push({status:'รอผู้อนุมัติ2', label:'ผู้อนุมัติ (ลำดับ 2/3)'});
  }
  if(isReceivableDoc_(doc)) chain.push({status:'รอรับเงิน', label:'รับเงิน (การเงิน)'}); else chain.push({status:'รอชำระเงิน', label:'การเงิน'});
  const idx = chain.findIndex(s=>s.status===doc.status);
  const dots = chain.map((s,i)=>{
    const cls = i<idx ? 'done' : (i===idx ? 'current' : '');
    const bar = i>0 ? `<span class="bar ${i-1<idx?'done':''}"></span>` : '';
    return bar + `<span class="stg ${cls}" title="${s.label}"></span>`;
  }).join('');
  const trailLabel = chain[idx] ? chain[idx].label : '';
  const who = assignedActorName(doc);
  return `<div><div class="trail">${dots}</div><div class="trail-label">รอ${trailLabel}${who ? `<div style="font-weight:400;opacity:.85;">${who}</div>` : ''}</div></div>`;
}

/* ============================= SHARED: GROUP BY DUE ============================= */
function normalizeDateOnly(str){
  if(!str) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str; // already plain YYYY-MM-DD, nothing to fix
  try{
    const dt = new Date(str);
    if(isNaN(dt.getTime())) return str;
    const y = dt.getFullYear();
    const m = String(dt.getMonth()+1).padStart(2,'0');
    const d = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }catch(e){ return str; }
}
// ---- shared helpers for the approval screens: queue time + GROUP bar (ทั้งหมด / รอบชำระเงิน / ประเภท) ----
// ms timestamp of a stored date-time string ("D/M/BE, HH:MM:SS" from nowStr(), or an ISO string Sheets may return);
// unknown values sort last
function dtMs_(str){
  if(!str) return 9e15;
  const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let y = parseInt(m[3],10); if(y>2400) y-=543;
    return new Date(y, parseInt(m[2],10)-1, parseInt(m[1],10), parseInt(m[4]||0,10), parseInt(m[5]||0,10), parseInt(m[6]||0,10)).getTime();
  }
  const t = Date.parse(String(str));
  if(isNaN(t)) return 9e15;
  const dt = new Date(t);
  return dt.getFullYear()>2400 ? new Date(dt.getFullYear()-543, dt.getMonth(), dt.getDate(), dt.getHours(), dt.getMinutes(), dt.getSeconds()).getTime() : t;
}
// when the PREVIOUS step handed this document over (so approvers can work the queue in order)
function docPrevStepDate_(d){
  const st = String(d.status||'');
  if(st.startsWith('ตีกลับ')) return d.modifiedDate || d.createdDate;
  if(st==='รอนักบัญชี') return d.createdDate;
  if(st==='รอผู้ตรวจสอบ') return d.accountantDate || d.createdDate;
  if(st==='รอผู้อนุมัติ') return d.reviewerDate || d.accountantDate || d.createdDate;
  if(st==='รอผู้อนุมัติ2') return d.approverDate || d.reviewerDate || d.accountantDate || d.createdDate;
  return d.modifiedDate || d.createdDate;
}
function pvPrevStepDate_(v){
  try{
    const log = JSON.parse(v.historyLog||'[]');
    if(Array.isArray(log) && log.length && log[log.length-1].date) return log[log.length-1].date;
  }catch(e){}
  if(v.status==='รอผู้อนุมัติPayment') return v.reviewerDate || v.createdDate;
  return v.createdDate;
}
function groupBarHTML_(current, fn){
  const b = (key,label)=>`<button class="btn btn-sm ${current===key?'btn-approve':'btn-outline'}" onclick="${fn}('${key}')">${label}</button>`;
  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
    <span style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700;">Group:</span>
    ${b('none','ทั้งหมด')}${b('due','รอบชำระเงิน')}${b('type','ประเภท')}
  </div>`;
}
// items sorted by queue time (oldest first), then bucketed by the chosen GROUP; returns [{label,items}]
function groupForApproval_(items, mode, msOf, dueOf, typeOf){
  const sorted = items.slice().sort((a,b)=>msOf(a)-msOf(b));
  if(mode==='none') return [{label:null, items:sorted}];
  const map = {}, order = [];
  sorted.forEach(it=>{
    const raw = mode==='type' ? (typeOf(it)||'ไม่ระบุ') : (normalizeDateOnly(dueOf(it))||'ไม่ระบุ');
    if(!map[raw]){ map[raw] = []; order.push(raw); }
    map[raw].push(it);
  });
  if(mode!=='type') order.sort();
  return order.map(k=>({ label: mode==='type' ? docTypeInfo(k).label : 'รอบชำระเงิน '+(k==='ไม่ระบุ'?'ไม่ระบุ':fmtDate(k)), items: map[k] }));
}
function setApprovalGroupBy(k){ state.approvalGroupBy=k; state.expandedRow=null; render(); }
function setPvGroupBy(k){ state.pvGroupBy=k; state.expandedRow=null; render(); }
// document types whose documents are approved on the "อนุมัติ Payment" side (same mapped chain, Complete at the end, no finance step)
function isReceivableType_(key){ const t = state.docTypes.find(x=>x.key===key); return !!(t && t.receivable); }
function isReceivableDoc_(d){ return isReceivableType_(d.docType); }
// status a document moves to once ALL approval sign-offs are done
function afterApprovalStatus_(doc, skipFinance){ return isReceivableDoc_(doc) ? 'รอรับเงิน' : (skipFinance ? 'Complete' : 'รอชำระเงิน'); }
function isViaPaymentType_(key){ const t = state.docTypes.find(x=>x.key===key); return !!(t && t.viaPayment); }
function isViaPaymentDoc_(d){ return isViaPaymentType_(d.docType); }
function viaTypesExist_(){ return state.docTypes.some(t=>t.viaPayment); }
function viaApprovalTabs_(){ return viaTypesExist_() ? allowedApprovalTabs().filter(t=>t!=='accountant') : []; }
function groupByDue(list){
  const map = {};
  list.forEach(d=>{
    const key = normalizeDateOnly(d.dueDate) || 'ไม่ระบุ';
    if(!map[key]) map[key] = [];
    map[key].push(d);
  });
  return Object.keys(map).sort().map(key=>({due:key, items:map[key]}));
}
function groupByType(list){
  const map = {};
  list.forEach(d=>{
    const key = d.docType || 'ไม่ระบุ';
    if(!map[key]) map[key] = [];
    map[key].push(d);
  });
  return Object.keys(map).map(key=>({type:key, items:map[key]}));
}
function docTypeSelectOptions(selected){
  return '<option value="">ทุกประเภท</option>' + state.docTypes.map(t=>`<option value="${t.key}" ${selected===t.key?'selected':''}>${t.label}</option>`).join('');
}

async function saveMemberEdit(e, id){
  e.preventDefault();
  if(!canEditMemberDetails()) return;
  const f = new FormData(e.target);
  const fn = f.get('firstName').trim();
  const ln = f.get('lastName').trim();
  if(!isEnglishOnly(fn) || !isEnglishOnly(ln)){ showToast('กรุณากรอกชื่อและนามสกุลเป็นภาษาอังกฤษเท่านั้น'); return; }
  const position = f.get('position'), email = f.get('email'), phone = f.get('phone')||'';
  const res = await apiCall('updateMemberDetails', { id, firstName:fn, lastName:ln, position, email, phone });
  if(!res.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  const m = state.members.find(x=>x.id===id);
  if(m){ m.firstName=fn; m.lastName=ln; m.position=position; m.email=email; m.phone=phone; }
  state.memberEditId = null;
  showToast('บันทึกข้อมูลสมาชิกเรียบร้อย');
  render();
}
async function resetMemberPassword(id){
  if(!isAdmin()) return;
  const res = await apiCall('resetPassword', { id });
  if(!res.success){ showToast('รีเซ็ตรหัสผ่านไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  const m = state.members.find(x=>x.id===id);
  if(m){ m.hasPassword = false; }
  showToast('รีเซ็ตรหัสผ่านของ '+(m?m.firstName:'')+' แล้ว — เข้าสู่ระบบครั้งถัดไปต้องตั้งรหัสผ่านใหม่');
  render();
}
