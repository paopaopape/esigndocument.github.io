    <div class="stat-card s-approver"><div class="num">${docs.length}</div><div class="lbl">เอกสารที่จ่ายแล้ว</div></div>
    <div class="stat-card s-complete"><div class="num" style="font-size:22px;">${money(totalNet)}</div><div class="lbl">ยอดจ่ายสุทธิรวม (บาท)</div></div>
  </div>`;

  const filterBar = `
  <div class="filter-bar">
    <div class="f-field"><label>ค้นหาเลข Doc Payment</label><input id="report-f-docpayment" type="text" placeholder="เช่น 6100001621" value="${s.docPayment}" oninput="setReportSearch('docPayment', this.value)"></div>
    <div class="f-field"><label>ผู้ทำรายการ</label><input id="report-f-by" type="text" placeholder="ชื่อผู้จ่ายเงิน..." value="${s.by}" oninput="setReportSearch('by', this.value)"></div>
    <div class="f-field"><label>จากวันที่</label><input id="report-f-from" type="date" value="${s.from}" onchange="setReportSearch('from', this.value)"></div>
    <div class="f-field"><label>ถึงวันที่</label><input id="report-f-to" type="date" value="${s.to}" onchange="setReportSearch('to', this.value)"></div>
    <button class="filter-clear" onclick="clearReportSearch()">ล้างตัวกรอง</button>
  </div>`;

  const rows = batchList.length ? batchList.map(b=>`
    <tr>
      <td class="mono" style="white-space:nowrap;">${b.stage.v ? b.stage.v.id : '-'}</td>
      <td class="mono">${b.docPayment}</td>
      <td>${pvItemCellHTML_(b.stage.v)}</td>
      <td>${b.count} รายการ</td>
      <td>${batchPayTypeLabel(b)}</td>
      <td>${money(b.vat)}</td>
      <td>${money(b.wht)}</td>
      <td>${money(b.base)}</td>
      <td><b>${money(b.net)}</b></td>
      <td>${b.paymentBy||'-'}</td>
      <td>${b.paymentDate||'-'}</td>
      <td style="white-space:nowrap;">${batchDueLabel(b)}</td>
      <td>${b.stage.key==='none' ? '<span style="color:var(--ink-soft);">-</span>' : `<span class="status-pill ${b.stage.rejected?'reject':''}">${b.stage.label}</span>${(b.stage.key==='review'||b.stage.key==='approve') && pvStageWho_(b.stage) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">รอ: ${pvStageWho_(b.stage)}</div>`:''}`}</td>
      <td style="white-space:nowrap;">
        ${b.docPaymentLink ? `<a class="icon-btn ql-payment" href="${b.docPaymentLink}" target="_blank" rel="noopener" title="เปิดไฟล์สลิป/หลักฐานการโอน">${PAYMENT_SLIP_SVG}</a>` : ''}

  return `

function setReportCompany(v){ state.reportCompany = v; render(); }
function setReportSearch(field, val){ state.reportSearch[field] = val; render(); }
function clearReportSearch(){ state.reportSearch = {docPayment:'', by:'', from:'', to:''}; state.reportStatus='all'; render(); }
function setReportStatus(v){ state.reportStatus = (state.reportStatus===v ? 'all' : v); render(); }
// stage of a Doc Payment batch in the Payment close-out flow (from PaymentVouchers)
function pvStageOfBatch_(docPayment){
  const v = state.paymentVouchers.find(x=>String(x.docPayment)===String(docPayment));
  if(!v) return {key:'none', label:'-', v:null};
  const st = v.status||'';
  if(st==='รอผู้ตรวจสอบPayment') return {key:'review', label:'รอผู้ตรวจสอบ', v};
  if(st==='รอผู้อนุมัติPayment') return {key:'approve', label:'รอผู้อนุมัติ', v};
  if(st.indexOf('ตีกลับ')===0) return {key:'review', label:'↺ '+st, v, rejected:true};
  if(st==='Complete') return {key:'done', label:'อนุมัติแล้ว', v};
  return {key:'none', label:st||'-', v};
}
function pvStageWho_(stage){
  if(!stage.v) return '';
  return pvAssignedActorName(stage.v) || '';
}

/* ---- Excel export (SheetJS) — shared by Payment Voucher and Report Payment ---- */
function exportAoaToExcel(aoa, filename, sheetName){
  if(typeof XLSX === 'undefined'){ showToast('โหลดไลบรารี Excel ไม่สำเร็จ ลองรีเฟรชหน้าเว็บแล้วลองใหม่'); return; }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
  XLSX.writeFile(wb, filename);
}

function closeBatchEdit(){

async function saveBatchEdit(e, oldDocPayment){
  e.preventDefault();
  const f = new FormData(e.target);
  const newDocPayment = f.get('docPayment').trim();
  const newLink = f.get('docPaymentLink').trim();
  if(!newDocPayment){ showToast('กรุณาระบุเลข Doc Payment'); return; }
  const docs = state.documents.filter(d=>String(d.docPayment)===String(oldDocPayment));
  if(!docs.length){ showToast('ไม่พบเอกสารของ Doc Payment นี้'); return; }
  showBusyOverlay('กำลังบันทึกการแก้ไข กรุณารอสักครู่...');
  for(const doc of docs){
    const patch = {
      id: doc.id, docPayment: newDocPayment, docPaymentLink: newLink,
      modifiedBy: fullName(state.user), modifiedDate: nowStr(),
    };
    const res = await apiCall('updateDocument', patch);
    if(!res.success){ hideBusyOverlay(); showToast('บันทึกไม่สำเร็จที่เอกสาร '+displayId(doc.id)+' ลองใหม่อีกครั้ง'); await refreshData(); render(); return; }
  }
  // keep the Payment close-out batch's own Doc Payment number in step with the documents
  if(newDocPayment !== String(oldDocPayment)){
    const pvs = state.paymentVouchers.filter(v=>v.status!=='ยกเลิก' && String(v.docPayment)===String(oldDocPayment) && docs.some(d=>String(d.companyCode)===String(v.companyCode)));
    for(const pv of pvs){ await apiCall('updatePaymentVoucher', { id: pv.id, docPayment: newDocPayment }); }
  }
  hideBusyOverlay();
  showToast('แก้ไข Doc Payment เรียบร้อย');
  state.paymentHistoryEditId = null;
  await refreshData();
  render();
}

    list = list.filter(d=>state.user.companyCodes.includes(d.companyCode));
  }
  if(state.paymentCompany!=='all') list = list.filter(d=>d.companyCode===state.paymentCompany);
  const s = state.paymentSearch;
  if(s.type) list = list.filter(d=>d.docType===s.type);
  if(s.name && s.name.trim()) list = list.filter(d=>d.docName.toLowerCase().includes(s.name.trim().toLowerCase()));
  if(s.due) list = list.filter(d=>normalizeDateOnly(d.dueDate)===s.due);

  if(s.by && s.by.trim()) docs = docs.filter(d=>(d.paymentBy||'').toLowerCase().includes(s.by.trim().toLowerCase()));
  if(s.from){ const from = new Date(s.from); docs = docs.filter(d=>{ const dt = parseThaiDateStr(d.paymentDate); return dt && dt >= from; }); }
  if(s.to){ const to = new Date(s.to); to.setHours(23,59,59,999); docs = docs.filter(d=>{ const dt = parseThaiDateStr(d.paymentDate); return dt && dt <= to; }); }
  if(!docs.length){ showToast('ไม่มีข้อมูลให้ Export'); return; }
  docs.sort((x,y)=>{ const a=dtMs_(x.paymentDate), b=dtMs_(y.paymentDate); return (b>=9e15?-1:b)-(a>=9e15?-1:a); });
  // export at document level (one row per document) so payType/amounts are exact, not aggregated

  const rows = docs.map(d=>[

    payTypeLabel(d.payType), parseFloat(d.vatAmount)||0, parseFloat(d.whtAmount)||0, parseFloat(d.baseAmount)||0, parseFloat(d.netAmount)||0,

  ]);
  exportAoaToExcel([header, ...rows], 'ReportPayment_'+new Date().toISOString().slice(0,10)+'.xlsx', 'Report Payment');

async function addMember(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const fn = f.get('firstName').trim();
  const ln = f.get('lastName').trim();
  if(!isEnglishOnly(fn) || !isEnglishOnly(ln)){ showToast('กรุณากรอกชื่อและนามสกุลเป็นภาษาอังกฤษเท่านั้น'); return; }
  const position = f.get('position'), email = f.get('email'), phone = f.get('phone')||'';
  const res = await apiCall('addMember', { firstName:fn, lastName:ln, position, email, phone });
  if(!res.success){
    if(res.error==='name_must_be_english') showToast('กรุณากรอกชื่อและนามสกุลเป็นภาษาอังกฤษเท่านั้น');
    else showToast('เพิ่มสมาชิกไม่สำเร็จ ลองใหม่อีกครั้ง');
    return;
  }
  state.members.push({
    id: res.id, firstName: fn, lastName: ln, position, email, phone,
    role:'User', companyCodes:[], hasPassword:false,
    createdDate: new Date().toLocaleDateString('th-TH'),
  });
  showToast('เพิ่มสมาชิก '+fn+' เรียบร้อย · รหัสสมาชิก '+res.id+' — แจ้งให้เขาไปตั้งรหัสผ่านที่หน้า Login');
  e.target.reset();
  render();
}

function clearPermSearch(){ state.permSearch = {name:'', email:''}; render(); }
function editPerm(id){ state.permEditId = id; render(); }
async function savePermission(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const role = f.get('role');
  const companyCodes = f.getAll('companyCodes');
  const canTrack = f.get('canTrack') === 'on';
  // Per-company Payment duty, read straight off the company table rows (pvReview_<code> /
  // pvApprove_<code>) — these become this member's reviewerId/approverId in Payment Mapping
  // for exactly those companies, and nowhere else. See handleSavePermission in Code.gs.
  const pvReviewCompanies = state.companies.filter(c=>f.get('pvReview_'+c.code)==='on').map(c=>c.code);
  const pvApproveCompanies = state.companies.filter(c=>f.get('pvApprove_'+c.code)==='on').map(c=>c.code);
  const res = await apiCall('savePermission', { id, role, companyCodes, canTrack, pvReviewCompanies, pvApproveCompanies });
  if(!res.success){ showToast('บันทึกสิทธิ์ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  const mBefore = state.members.find(x=>x.id===id);
  const savedName = mBefore ? mBefore.firstName : '';
  state.permEditId = null;
  await refreshData();
  // refreshData() rebuilds state.members, so re-point state.user if the editor is editing themself
  if(state.user && state.user.id===id){
    const refreshedUser = state.members.find(x=>x.id===id);
    if(refreshedUser) state.user = refreshedUser;
  }
  showToast('บันทึกสิทธิ์ของ '+savedName+' เรียบร้อย');
  render();
}

/* ---- Signature image upload (compressed client-side to keep the Sheet cell small) ---- */
function uploadMemberSignature(e, id){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxW = 300;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width*scale));
      canvas.height = Math.max(1, Math.round(img.height*scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75); // JPEG keeps the base64 small enough for a Sheets cell
      const res = await apiCall('saveMemberSignature', { id, signatureImage: dataUrl });
      if(!res.success){ showToast('บันทึกลายเซ็นไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
      const m = state.members.find(x=>x.id===id);
      if(m) m.signatureImage = dataUrl;
      showToast('บันทึกลายเซ็นเรียบร้อย');
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
async function removeMemberSignature(id){
  const res = await apiCall('saveMemberSignature', { id, signatureImage: '' });
  if(!res.success){ showToast('ลบลายเซ็นไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  const m = state.members.find(x=>x.id===id);
  if(m) m.signatureImage = '';
  showToast('ลบลายเซ็นแล้ว');
  render();
}

async function saveQuickLinks(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const entries = ['folderUrl','paymentSlipUrl','receiptUrl','whtUrl'].map(k=>[k, f.get(k).trim()]);
  for(const [key, value] of entries){
    const res = await apiCall('saveAppSetting', { key, value });
    if(!res.success){ showToast('บันทึกลิงก์ไม่สำเร็จที่ '+key+' ลองใหม่อีกครั้ง'); return; }
    state.appSettings[key] = value;
  }
  showToast('บันทึกลิงก์ Quick Links เรียบร้อย');
  render();
}

// dropdown of the people who hold that Payment duty for the account's company (ticked on กำหนดสิทธิ์การใช้งาน)
function accountRoutingSelect_(a, field){
  const mp = getPaymentMapping(a.companyCode);
  const ids = mp ? pvIds_(mp[field]) : [];
  const cur = String(a[field]||'');
  const opts = ids.map(id=>{ const m = state.members.find(x=>x.id===id); return m ? `<option value="${id}" ${cur===id?'selected':''}>${fullName(m)}</option>` : ''; }).join('');
  const stale = cur && !ids.includes(cur) ? `<option value="${cur}" selected>(ไม่มีสิทธิ์แล้ว)</option>` : '';
  return `<select onchange="setAccountRouting('${a.id}','${field}',this.value)" style="min-width:160px;"><option value="">— ทุกคนของบริษัท —</option>${opts}${stale}</select>`;
}
async function setAccountRouting(id, field, value){
  const res = await apiCall('setPaymentAccountRouting', { id, [field]: value });
  if(!res.success){ showToast(res.error==='not_eligible' ? 'คนนี้ไม่ได้รับสิทธิ์ Payment ของบริษัทนี้' : 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); await refreshData(); render(); return; }
  showToast('บันทึกเรียบร้อย');
  await refreshData();
  render();
}
async function addPaymentAccount(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const companyCode = String(f.get('companyCode')||'').trim();
  const accountNo = String(f.get('accountNo')||'').trim();
  const owner = String(f.get('owner')||'').trim();
  if(!companyCode || !accountNo || !owner){ showToast('กรุณากรอก Com, เลขที่บัญชี และ Owner ให้ครบ'); return; }
  const res = await apiCall('savePaymentAccount', { companyCode, accountNo, owner, createdBy: fullName(state.user) });
  if(!res.success){ showToast('บันทึกบัญชีไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  showToast(res.updated ? 'มีเลขที่บัญชีนี้ใน Com นี้แล้ว — อัปเดต Owner ให้' : 'เพิ่มบัญชีโอนเรียบร้อย');
  e.target.reset();
  await refreshData();
  render();
}
async function deletePaymentAccount(id){
  const res = await apiCall('deletePaymentAccount', { id });
  if(!res.success){ showToast('ลบบัญชีไม่สำเร็จ'); return; }
  showToast('ลบบัญชีแล้ว');
  await refreshData();
  render();
}

async function addVendor(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const companyCode = String(f.get('companyCode')||'').trim();
  const vendorCode = f.get('vendorCode').trim();
  const vendorName = f.get('vendorName').trim();
  if(!companyCode){ showToast('กรุณาเลือก Com'); return; }
  const bankAccount = f.get('bankAccount').trim();
  const bankName = f.get('bankName').trim();
  if(state.vendors.some(v=>String(v.companyCode)===companyCode && String(v.vendorCode).toLowerCase()===vendorCode.toLowerCase())){
    showToast('มีรหัส Vendor นี้ใน Com '+companyCode+' อยู่แล้ว — บันทึกนี้จะอัปเดตข้อมูลเดิมทับ');
  }
  const res = await apiCall('saveVendor', { companyCode, vendorCode, vendorName, bankAccount, bankName, createdBy: fullName(state.user) });
  if(!res.success){ showToast('บันทึก Vendor ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  showToast('บันทึก Vendor เรียบร้อย');
  e.target.reset();
  await refreshData();
  render();
}
async function deleteVendor(companyCode, vendorCode){
  const res = await apiCall('deleteVendor', { companyCode, vendorCode });
  if(!res.success){ showToast('ลบ Vendor ไม่สำเร็จ'); return; }
  showToast('ลบ Vendor แล้ว');
  await refreshData();
  render();
}
function uploadVendorFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('vendor-upload-status');
  if(statusEl) statusEl.textContent = 'กำลังอ่านไฟล์...';
  const reader = new FileReader();
  reader.onload = async function(ev){
    try{
      if(typeof XLSX === 'undefined'){ if(statusEl) statusEl.textContent='โหลดไลบรารีอ่านไฟล์ไม่สำเร็จ ลองรีเฟรชหน้าเว็บ'; return; }
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      if(!aoa.length){ if(statusEl) statusEl.textContent='ไฟล์ว่างเปล่า'; return; }
      const header = aoa[0].map(h=>String(h).trim().toLowerCase());
      const findCol = names => header.findIndex(h=>names.some(n=>h.includes(n)));
      const comIdx = header.findIndex(h=>['com','company','companycode','company code','รหัสบริษัท','บริษัท'].includes(h));
      const codeIdx = header.findIndex((h,i)=>i!==comIdx && ['vendor code','vendor','รหัส'].some(n=>h.includes(n)));
      const nameIdx = findCol(['vendor name','ชื่อ']);
      const bankIdx = findCol(['เลขที่บัญชี','bankaccount','account']);
      const bankNameIdx = findCol(['bankname','ธนาคาร']);
      if(comIdx===-1){ if(statusEl) statusEl.textContent='ไม่พบคอลัมน์ Com (รหัสบริษัท) ในไฟล์ — ต้องมีคอลัมน์ Com เป็นคอลัมน์แรก'; return; }
      if(codeIdx===-1 || nameIdx===-1){ if(statusEl) statusEl.textContent='ไม่พบคอลัมน์ Vendor / Vendor Name ในไฟล์ กรุณาตรวจสอบหัวคอลัมน์'; return; }
      const validCos = new Set(state.companies.map(c=>String(c.code)));
      let badCom = 0;
      const rows = aoa.slice(1)
        .filter(r=>r[codeIdx] && String(r[codeIdx]).trim())
        .filter(r=>{ const ok = validCos.has(String(r[comIdx]).trim()); if(!ok) badCom++; return ok; })
        .map(r=>({
          companyCode: String(r[comIdx]).trim(),
          vendorCode: String(r[codeIdx]).trim(),
          vendorName: String(r[nameIdx]||'').trim(),
          bankAccount: bankIdx!==-1 ? String(r[bankIdx]||'').trim() : '',
          bankName: bankNameIdx!==-1 ? String(r[bankNameIdx]||'').trim() : '',
        }));
      if(!rows.length){ if(statusEl) statusEl.textContent='ไม่พบข้อมูล Vendor ที่มี Com ถูกต้องในไฟล์'+(badCom?' (ข้าม '+badCom+' แถวที่ Com ว่างหรือไม่ตรงกับบริษัทในระบบ)':''); return; }
      showBusyOverlay('กำลังอัปโหลด Vendor Master ('+rows.length+' รายการ) กรุณารอสักครู่...');
      const res = await apiCall('bulkUploadVendors', { rows, createdBy: fullName(state.user) });
      hideBusyOverlay();
      if(!res.success){ if(statusEl) statusEl.textContent='อัปโหลดไม่สำเร็จ ลองใหม่อีกครั้ง'; return; }
      if(statusEl) statusEl.textContent = 'อัปโหลดสำเร็จ '+rows.length+' รายการ'+(badCom?' · ข้าม '+badCom+' แถวที่ Com ว่างหรือไม่ตรงกับบริษัทในระบบ':'');
      showToast('อัปโหลด Vendor Master เรียบร้อย ('+rows.length+' รายการ)');
      e.target.value = '';
      await refreshData();
      render();
    }catch(err){
      if(statusEl) statusEl.textContent = 'อ่านไฟล์ไม่สำเร็จ: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---- Email Log viewer ---- */
function emailLogTableHTML(){
  const L = state.emailLog;
  const loadBtn = `<button class="btn btn-sm btn-outline" onclick="loadEmailLog()" ${L&&L.loading?'disabled':''}>${L&&L.loading?'กำลังโหลด...':(L&&L.rows?'↻ โหลดใหม่':'โหลดประวัติการส่งเมล')}</button>`;
  if(!L || !L.rows) return loadBtn;
  const f = L.filter || 'all';
  const rows = L.rows.filter(r=> f==='all' || r.status===f);
  const failedCount = L.rows.filter(r=>r.status==='ล้มเหลว').length;
  const badge = st => st==='สำเร็จ' ? '<span class="badge badge-blue">สำเร็จ</span>' : st==='ล้มเหลว' ? '<span class="badge badge-pink">ล้มเหลว</span>' : '<span class="badge badge-gold">ไม่ส่ง</span>';
  const esc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const body = rows.map(r=>`<tr>
    <td style="white-space:nowrap;font-size:12px;">${esc(r.time)}</td>
    <td>${esc(r.kind)}</td>
    <td class="mono">${esc(r.refId)}</td>
    <td>${esc(r.companyCode)}</td>
    <td style="font-size:12px;">${esc(r.to)||'-'}</td>
    <td>${badge(r.status)}${r.error?`<div style="font-size:11px;color:var(--stamp-red);max-width:220px;">${esc(r.error)}</div>`:''}</td>
    <td style="font-size:11.5px;color:var(--ink-soft);max-width:240px;">${esc(r.reason)}</td>
    <td>${r.attempts||0}</td>
    <td>${r.status==='ล้มเหลว'?`<button class="btn btn-sm btn-action" onclick="resendEmailRow('${r.id}')">ส่งซ้ำ</button>`:''}</td>
  </tr>`).join('') || '<tr class="empty-row"><td colspan="9">ไม่มีรายการ</td></tr>';
  const opt = (v,l)=>`<option value="${v}" ${f===v?'selected':''}>${l}</option>`;
  return `
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
    ${loadBtn}
    <select onchange="setEmailLogFilter(this.value)">${opt('all','ทุกสถานะ')}${opt('สำเร็จ','สำเร็จ')}${opt('ล้มเหลว','ล้มเหลว')}${opt('ไม่ส่ง','ไม่ส่ง')}</select>
    ${failedCount?`<button class="btn btn-sm btn-primary" onclick="resendAllFailedEmails()">ส่งซ้ำทุกฉบับที่ล้มเหลว (${failedCount})</button>`:''}
    <span style="font-size:12px;color:var(--ink-soft);">แสดงล่าสุด ${L.rows.length} รายการ${L.quota!=null?` · โควตาส่งเมลวันนี้เหลือ ${L.quota} ฉบับ`:''}</span>
  </div>
  <div style="overflow-x:auto;"><table>
    <thead><tr><th>เวลา</th><th>ประเภท</th><th>อ้างอิง</th><th>บริษัท</th><th>ผู้รับ</th><th>สถานะ</th><th>เหตุผลเลือกผู้รับ</th><th>ครั้ง</th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}
async function loadEmailLog(){
  state.emailLog = Object.assign({ filter:'all' }, state.emailLog||{}, { loading:true });
  render();
  const res = await apiCall('getEmailLog', {});
  if(!res || !res.success){ state.emailLog.loading=false; render(); showToast('โหลดประวัติการส่งเมลไม่สำเร็จ'); return; }
  state.emailLog = { rows:res.rows||[], quota:res.quota, filter:(state.emailLog&&state.emailLog.filter)||'all', loading:false };
  render();
}
function setEmailLogFilter(v){ if(state.emailLog){ state.emailLog.filter=v; render(); } }
async function resendEmailRow(id){
  const res = await apiCall('resendEmail', { id });
  if(!res.success){ showToast('ส่งซ้ำไม่สำเร็จ'); return; }
  showToast(res.sent ? 'ส่งซ้ำสำเร็จ' : 'ส่งซ้ำแล้วแต่ยังล้มเหลว — ดูข้อความ error ในตาราง');
  await loadEmailLog();
}
async function resendAllFailedEmails(){
  const res = await apiCall('resendFailedEmails', {});
  if(!res.success){ showToast('ส่งซ้ำไม่สำเร็จ'); return; }
  showToast('ลองส่งซ้ำ '+res.tried+' ฉบับ สำเร็จ '+res.sent+' ฉบับ');

}

async function saveDigestSettings(e){
  e.preventDefault();
  const dayChecks = document.querySelectorAll('.digest-day-chk');
  const days = Array.from(dayChecks).filter(c=>c.checked).map(c=>c.value).join(',');
  const hourChecks = document.querySelectorAll('.digest-hour-chk');
  const hours = Array.from(hourChecks).filter(c=>c.checked).map(c=>c.value).join(',');
  const appLink = document.getElementById('digest-app-link').value.trim();
  const boolKeys = ['digestEnabled','digestRoleAccountant','digestRoleReviewer','digestRoleApprover'];
  showBusyOverlay('กำลังบันทึกการตั้งค่าสรุปรายวัน กรุณารอสักครู่...');
  for(const key of boolKeys){
    const el = document.getElementById('notif-'+key);
    const value = (el && el.checked) ? 'TRUE' : '';
    const res = await apiCall('saveAppSetting', { key, value });
    if(!res.success){ hideBusyOverlay(); showToast('บันทึกไม่สำเร็จที่ '+key); return; }
    state.appSettings[key] = value;
  }
  const res2 = await apiCall('saveAppSetting', { key:'digestDays', value: days });
  const res3 = await apiCall('saveAppSetting', { key:'appLinkUrl', value: appLink });
  const res4 = await apiCall('saveAppSetting', { key:'digestHours', value: hours });
  hideBusyOverlay();
  if(!res2.success || !res3.success || !res4.success){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  state.appSettings.digestDays = days;
  state.appSettings.appLinkUrl = appLink;
  state.appSettings.digestHours = hours;
  showToast('บันทึกการตั้งค่าสรุปรายวันเรียบร้อย — อย่าลืมกด "เปิดใช้งาน Trigger อัตโนมัติ" ด้วย');
  render();
}

async function saveBulkReviewerMapping(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const companyCode = f.get('companyCode');
  const reviewerId = f.get('reviewerId');
  const types = f.getAll('bulkDocType');
  if(!reviewerId){ showToast('กรุณาเลือกผู้ตรวจสอบ'); return; }
  if(!types.length){ showToast('กรุณาติ๊กประเภทเอกสารอย่างน้อย 1 ประเภท'); return; }
  for(const docType of types){
    const res = await apiCall('saveApprovalMapping', { docType, companyCode, reviewerId });
    if(!res.success){ showToast('บันทึกไม่สำเร็จที่ประเภท '+docType); return; }
  }
  showToast('บันทึกผู้ตรวจสอบให้ '+types.length+' ประเภทเอกสารเรียบร้อย');
  await refreshData();
  render();
}

async function backfillPaymentVouchers(){
  const pre = await apiCall('backfillPaymentVouchers', { dryRun:true });
  if(!pre || !pre.success){ showToast('ตรวจรายการไม่สำเร็จ — อาจต้อง Deploy Apps Script เวอร์ชันล่าสุดก่อน'); return; }
  if(!pre.count){ showToast('ไม่มีรายการที่ต้องสร้างย้อนหลัง'); return; }
  const lines = pre.items.map(i=>'• Doc Payment '+i.docPayment+' · บริษัท '+i.companyCode+' · '+i.docs+' เอกสาร').join('\n');
  if(!confirm('จะสร้างชุดปิดรอบ Payment ย้อนหลัง '+pre.count+' ชุด และส่งเมลแจ้งผู้ตรวจสอบ Payment:\n\n'+lines+'\n\nดำเนินการต่อหรือไม่?')) return;
  showBusyOverlay('กำลังสร้างชุดปิดรอบ Payment...');
  const res = await apiCall('backfillPaymentVouchers', {});
  hideBusyOverlay();
  if(!res || !res.success){ showToast('สร้างไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  showToast('สร้างชุดปิดรอบ Payment ย้อนหลัง '+res.created+' ชุดเรียบร้อย');
  await refreshData();
  render();
}
